<!DOCTYPE html>
<html th:replace="~{fragments/layout :: master(titolo='Library | Dashboard', contenuto=~{::main})}"
    xmlns:th="http://www.thymeleaf.org">

<head>

</head>

<body>


    <main class="dashboard-wrapper flex flex-column gap-1 w-100 h-100">
        <!-- Header -->
        <header class="dashboard-header flex justify-between align-center mb-2 animate-fade-in-up opacity-0">
            <div class="greeting">
                <h2 class="fw-700">Ciao, <span th:text="${user.userName}">User</span>.</h2>

                <p th:text="${user.userRole == 'role_admin' ? 'Benvenuto nella dashboard Admin.' : 'Benvenuto nella dashboard.'}"
                    class="opacity-70">Benvenuto nella dashboard.</p>
            </div>
            <div class="header-actions flex align-center gap-2">

                <!-- Aggiungi nuova edizione -->
                <button th:if="${user.userRole == 'role_admin' && section == 'edition'}"
                    class="btn-create btn-sm shadow-soft" onclick="openAddEditionPopup()" title="Aggiungi Edizione">
                    <i class="fa-solid fa-plus"></i>
                    <span class="btn-label">Aggiungi Edizione</span>
                </button>
                
                <!-- Aggiungi nuovo dipendente -->
                <button th:if="${user.userRole == 'role_admin' && section == 'users'}"
                    class="btn-create btn-sm shadow-soft" onclick="openAddUserPopup()" title="Aggiungi Dipendente">
                    <i class="fa-solid fa-plus"></i> 
                    <span class="btn-label">Aggiungi dipendente</span>
                </button>

                <div th:if="${(section == 'catalog' || section == 'users' || section == 'edition' || section == 'rents')}"
                    class="header-icon glass radius-circle center pointer shadow-soft" th:data-section="${section}"
                    onclick="openSearchPopup(this.getAttribute('data-section'))">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>

            </div>
        </header>

        <!-- Sezione Home per admin-->
        <div th:if="${section == 'home' && user.userRole == 'role_admin'}"
            class="dashboard-grid grid flex nowrap gap-3 animate-fade-in-up opacity-0 delay-1">

            <!-- Card 1: Users totali -->
            <a th:href="@{/api/navigation/users}" class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
                <div class="flex justify-between align-center mb-2">
                    <span class="opacity-70 font-size-small uppercase fw-700">Dipendenti</span>
                    <i class="fa-solid fa-users text-brand"></i>
                </div>
                <div class="flex align-end gap-1">
                    <span class="text-3xl fw-700" th:text="${totalUsers}">totalUsers</span>
                </div>
            </a>

            <!-- Card 2: Books totali -->
            <a th:href="@{/api/navigation/catalog}" class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
                <div class="flex justify-between align-center mb-2">
                    <span class="opacity-70 font-size-small uppercase fw-700">Totale manuali</span>
                    <i class="fa-solid fa-book text-brand"></i>
                </div>
                <div class="flex align-end gap-1">
                    <span class="text-3xl fw-700" th:text="${totalBooks}">totalBooks</span>
                </div>
            </a>

            <!-- Card 3: Books disponibili -->
            <a th:href="@{/api/navigation/catalog}" class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
                <div class="flex justify-between align-center mb-2">
                    <span class="opacity-70 font-size-small uppercase fw-700">Manuali disponibili</span>
                    <i class="fa-solid fa-check-to-slot text-success"></i>
                </div>
                <div class="flex align-end gap-1">
                    <span class="text-3xl fw-700" th:text="${totalBooks - totalRents}">availableBooks</span>
                </div>
            </a>

            <!-- Card 4: Books prestati -->
            <a th:href="@{/api/navigation/rents}" class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
                <div class="flex justify-between align-center mb-2">
                    <span class="opacity-70 font-size-small uppercase fw-700">Manuali in prestito</span>
                    <i class="fa-solid fa-hand-holding-hand text-warning"></i>
                </div>
                <div class="flex align-end gap-2">
                    <span class="text-3xl fw-700" th:text="${totalRents}">totalRents</span>
                </div>
            </a>

            <!-- Card 5: Books prenotati-->
            <a th:href="@{/api/navigation/rents}" class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
                <div class="flex justify-between align-center mb-2">
                    <span class="opacity-70 font-size-small uppercase fw-700">Manuali Prenotati</span>
                    <i class="fa-solid fa-clock text-info"></i>
                </div>
                <div class="flex align-end gap-2">
                    <span class="text-3xl fw-700" th:text="${totalBooksBooked}">totalBooksBooked</span>
                </div>
            </a>

        </div>

        <!-- Sezione Home per user-->
        <div th:if="${section == 'home' && user.userRole == 'role_user'}"
            class="dashboard-grid flex flex-wrap gap-3 animate-fade-in-up opacity-0 delay-1">

            <!-- Card 1: Borrowed Books -->
            <a th:href="@{/api/navigation/rents}" class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
                <div class="flex justify-between align-center mb-2">
                    <span class="opacity-70 font-size-small uppercase fw-700">Libri Prestati</span>
                    <i class="fa-solid fa-hand-holding-hand text-warning"></i>
                </div>
                <div class="flex align-end gap-2">
                    <span class="text-3xl fw-700" th:text="${totalRents}"></span>
                    <span class="opacity-50 font-size-small mb-1">In prestito</span>
                </div>
            </a>

        </div>

        <!-- Sezione Impostazioni Profilo in Home -->
        <div th:if="${section == 'profile'}" class="mt-6 animate-fade-in-up opacity-0 delay-2">
            <div class="card glass radius-12 p-6 shadow-card border-none" style="max-width: 500px;">
                <div class="flex align-center gap-4 mb-6">
                    <div class="icon-box-accent radius-12 p-3 flex center shadow-soft" style="background: rgba(245, 166, 35, 0.1); color: var(--color-accent);">
                        <i class="fa-solid fa-lock text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-xl fw-700 m-0 text-brand">Cambia Password</h3>
                        <p class="opacity-70 text-sm mt-1">Aggiorna le credenziali di accesso al tuo profilo</p>
                    </div>
                </div>
                
                <form th:action="@{/api/changePassword}" method="post" class="flex flex-column gap-5">
                    <input type="hidden" name="email" th:value="${user.userEmail}">
                    
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Password Attuale</label>
                        <input type="password" name="oldPassword" required
                            class="w-100 p-4 radius-12 border-none font-size-small bg-darkgrey"
                            placeholder="Inserisci la tua password attuale">
                    </div>
                    
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Nuova Password</label>
                        <input type="password" name="newPassword" required
                            class="w-100 p-4 radius-12 border-none font-size-small bg-darkgrey"
                            placeholder="Inserisci la nuova password">
                    </div>
                    
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Conferma Nuova Password</label>
                        <input type="password" name="confirmPassword" required
                            class="w-100 p-4 radius-12 border-none font-size-small bg-darkgrey"
                            placeholder="Ripeti la nuova password">
                    </div>
                    
                    <div class="mt-2">
                        <button type="submit" class="btn-create radius-12 px-6 py-3 cursor-pointer transition fw-700 shadow-soft border-none flex align-center gap-2">
                            <i class="fa-solid fa-check"></i> Aggiorna Password
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Sezione catalogo libri -->
        <div th:if="${section == 'catalog'}" class="grid gap-3 animate-fade-in-up opacity-0 delay-1">
            <div th:replace="~{fragments/catalog :: catalog}"
                class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">

            </div>
        </div>

        <div th:if="${section == 'edition'}" class="grid gap-3 animate-fade-in-up opacity-0 delay-1">
            <div th:replace="~{fragments/catalog :: edition}"
                class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">

            </div>
        </div>
        <!-- Sezione lista utenti per admin-->
        <div th:if="${section == 'users'}" class="grid gap-3 animate-fade-in-up opacity-0 delay-1">
            <div th:replace="~{fragments/users :: users}"
                class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
            </div>
        </div>
        <!-- Sezione lista prestiti -->
        <div th:if="${section == 'rents'}" class="grid gap-3 animate-fade-in-up opacity-0 delay-1">
            <div th:replace="~{fragments/rents :: rents}"
                class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
            </div>
        </div>

        <!-- Sezione impostazioni per admin-->
        <div th:if="${section == 'settings'}" class="grid gap-3 animate-fade-in-up opacity-0 delay-1">
            <div th:replace="~{fragments/settings :: settings}"
                class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
            </div>
        </div>

        <!-- Sezione registri libri -->
        <div th:if="${section == 'bookRecords' && user.userRole == 'role_admin'}" class="grid gap-3 animate-fade-in-up opacity-0 delay-1">
            <div th:replace="~{fragments/bookRecords :: bookRecords}"
                class="card glass radius-12 p-3 shadow-card flex flex-column justify-between border-none">
            </div>
        </div>



    </main>
    <script th:src="@{/js/dashboard.js}"></script>
</body>

</html>
