<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo_mba.svg}">
</head>

<body data-theme="light" class="flex align-center justify-center">

    <div id="login-wrapper" class="flex w-60 overflow-hidden">
	
        <!-- <div id="left-panel" class="flex flex-column justify-between p-relative radius-20 overflow-hidden">
            <div id="left-overlay" class="p-absolute z-1"></div>
        </div -->


        <div id="right-panel" class="flex flex-column align-end overflow-y-auto">

            <!-- Logo -->
            <div id="right-logo" class="self-end">
                <img th:src="@{/img/logo_mba.svg}" alt="MBA Logo" class="w-100">
            </div>

            <!-- form al centro -->
            <div id="right-form-wrapper" class="flex flex-column align-end mw-400 w-100">
                <h1 id="form-title" class="fw-700">Bentornato!</h1>
                <p id="form-subtitle">Accedi alla libreria aziendale</p>

                <!-- messaggio errore server-side da Spring Model Controller -->
                <div th:if="${error != null}" class="flex align-center radius-10 p-2 mb-2"
                    style="background: rgba(198, 40, 40, 0.08); border: 1px solid var(--color-error); color: var(--color-error); gap: 8px; font-size: 0.85rem;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- msg errore -->
                <div id="error-msg" class="none flex align-center radius-10">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-text">Credenziali non valide.</span>
                </div>
                <!-- email -->
                <form id="login-form" class="flex flex-column" th:action="@{/api/login}" method="post">
                    <div class="input-group flex flex-column">
                        <label for="email" class="fw-600 uppercase">Email</label>
                        <div class="input-wrapper flex align-center radius-10">
                            <i class="fa-solid fa-user input-icon no-pointer"></i>
                            <input type="text" id="email" name="email" placeholder="La tua email"
                                autocomplete="username" required>
                        </div>
                    </div>
                    <!-- Password -->
                    <div class="input-group flex flex-column">
                        <label for="password" class="fw-600 uppercase">Password</label>
                        <div class="input-wrapper flex align-center radius-10">
                            <i class="fa-solid fa-lock input-icon no-pointer"></i>
                            <input type="password" id="password" name="password" placeholder="La tua password"
                                autocomplete="current-password" required>
                            <!-- BTN Mostra Password -->
                            <button type="button" id="toggle-password" class="toggle-pw-btn cursor-pointer">
                                <i class="fa-solid fa-eye" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <!-- BTN Accedi -->
                    <button type="submit" id="login-btn"
                        class="flex align-center justify-center fw-700 radius-12 cursor-pointer w-100">
                        <span id="btn-text">Accedi</span>
                        <i class="fa-solid fa-arrow-right" id="btn-icon"></i>
                    </button>
                </form>
            </div>

            <!-- footer -->
            <div id="right-footer" class="align-end text-center">
                <p> M.A.Fproject - Libreria aziendale - © 2026</p>
            </div>
        </div>

    </div>

    <script th:src="@{/js/index.js}"></script>
</body>

</html>
