<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo_mba.svg}">
</head>

<body data-theme="light" class="flex align-center justify-center">

    <!-- Background Layer -->
    <div class="login-bg"></div>

    <main id="login-wrapper" class="flex align-center justify-center">
        
        <div id="login-card" class="glass-effect flex flex-column overflow-hidden">
            
            <div id="card-content" class="flex flex-column">
                
                <!-- Logo -->
                <div id="right-logo" class="self-center">
                    <img th:src="@{/img/logo_mba.svg}" alt="MBA Logo" class="w-100">
                </div>

                <div id="form-header" class="text-center">
                    <h1 id="form-title" class="fw-700">Bentornato!</h1>
                    <p id="form-subtitle">Accedi alla libreria aziendale</p>
                </div>

                <!-- Error Messages -->
                <div th:if="${error != null}" class="error-banner flex align-center radius-10 p-3 mb-4">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${error}"></span>
                </div>

                <div id="error-msg" class="none error-banner flex align-center radius-10 p-3 mb-4">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-text">Credenziali non valide.</span>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="flex flex-column" th:action="@{/api/login}" method="post">
                    
                    <div class="input-group flex flex-column">
                        <label for="email" class="fw-600 uppercase">Email</label>
                        <div class="input-wrapper flex align-center radius-10">
                            <i class="fa-solid fa-envelope input-icon no-pointer"></i>
                            <input type="email" id="email" name="email" placeholder="La tua email"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <div class="input-group flex flex-column">
                        <label for="password" class="fw-600 uppercase">Password</label>
                        <div class="input-wrapper flex align-center radius-10">
                            <i class="fa-solid fa-lock input-icon no-pointer"></i>
                            <input type="password" id="password" name="password" placeholder="La tua password"
                                autocomplete="current-password" required>
                            <button type="button" id="toggle-password" class="toggle-pw-btn cursor-pointer" aria-label="Toggle password visibility">
                                <i class="fa-solid fa-eye" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn"
                        class="flex align-center justify-center fw-700 radius-10 cursor-pointer w-100">
                        <span id="btn-text">Accedi</span>
                        <i class="fa-solid fa-arrow-right" id="btn-icon"></i>
                    </button>
                </form>

                <!-- Footer -->
                <footer id="login-footer" class="text-center">
                    <p>M.A.F.project - Libreria aziendale - © 2026</p>
                </footer>
            </div>
        </div>
    </main>

    <script th:src="@{/js/index.js}"></script>
</body>

</html>
