<!-- 
    -------------------------------------------------------------------------
    NAVBAR FRAGMENT (NAVBAR.HTML)
    -------------------------------------------------------------------------
    Gestisce la barra di navigazione laterale (Sidebar) su desktop
    e la bottom navigation bar su mobile (max 5 voci).
    Include il logo, i link di navigazione contestuali al ruolo dell'utente,
    lo switch per il tema (Light/Dark) e il pulsante di logout.
-->
<th:block th:fragment="navbar">

<!-- =====================================================================
     SIDEBAR — visibile solo su desktop (> 768px)
     ===================================================================== -->
<nav id="sidebar"
    class="glass radius-32 flex flex-column shadow-soft animate-slide-in-left opacity-0 p-3">
    
    <!-- Logo della Biblioteca -->
    <div class="sidebar-header flex align-center justify-center pt-3">
        <a th:href="@{/dashboard}"
            th:onclick="|setSection('home')|"
            class="sidebar-logo flex align-center justify-center radius-12">
            <img th:src="@{/img/logo_mba.svg}" alt="MBA Logo" class="sidebar-img">
        </a>
    </div>

    <!-- Contenuto Centrale: Link di Navigazione -->
    <div class="sidebar-content flex-1 p-2 overflow-y-auto">
        <div class="nav-group mb-3">
            <span class="nav-label font-size-small uppercase fw-700 opacity-50 px-2 mb-2 block">Menu</span>

            <!-- Link Home / Dashboard -->
            <a th:href="@{/api/navigation/home}"
            class="sidebar-link flex align-center gap-2 p-2 radius-12"
            th:classappend="${section == 'home' ? 'active' : ''}">
                <i class="fa-solid fa-house"></i>
                <span class="fw-600">Dashboard</span>
            </a>

            <!-- Link Profilo (Comune a tutti) -->
            <a th:href="@{/api/navigation/profile}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'profile' ? 'active' : ''}">
                <i class="fa-solid fa-user-gear"></i>
                <span class="fw-600">Profilo</span>
            </a>


            <!-- Link Catalogo (Comune a tutti) -->
            <a th:if="${user.userDto.userRole == 'role_user'}"
            th:href="@{/api/navigation/catalog}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'catalog' ? 'active' : ''}">
                <i class="fa-solid fa-list-ul"></i>
                <span class="fw-600">Libreria</span>
            </a>

            <!-- Sezione Amministratore: Manuali/Edizioni -->
            <a th:if="${user.userDto.userRole == 'role_admin'}"
                th:href="@{/api/navigation/edition}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'edition' ? 'active' : ''}">
                <i class="fa-solid fa-book-open"></i>
                <span class="fw-600">Manuali</span>
            </a>

            <!-- Sezione Utente: I Miei Prestiti -->
            <a th:if="${user.userDto.userRole == 'role_user'}" 
            th:href="@{/api/navigation/rents}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'rents' ? 'active' : ''}">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span class="fw-600">Prestiti</span>
            </a>

            <!-- Sezione Amministratore: Gestione Utenti -->
            <a th:if="${user.userDto.userRole == 'role_admin'}"
                th:href="@{/api/navigation/users}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'users' ? 'active' : ''}">
                <i class="fa-solid fa-users"></i>
                <span class="fw-600">Utenti</span>
            </a>

            <!-- Sezione Amministratore: Gestione Prestiti Totali -->
            <a th:if="${user.userDto.userRole == 'role_admin'}"
                th:href="@{/api/navigation/rents}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'rents' ? 'active' : ''}">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span class="fw-600">Prestiti</span>
            </a>

            <a th:if="${user.userDto.userRole == 'role_admin'}"
                th:href="@{/api/navigation/settings}"
                class="sidebar-link flex align-center gap-2 p-2 radius-12"
                th:classappend="${section == 'settings' ? 'active' : ''}">
                <i class="fa-solid fa-gear"></i>
                <span class="fw-600">Impostazioni</span>
            </a>
        </div>
    </div>

    <!-- Footer: Impostazioni Tema e Logout -->
    <div class="sidebar-footer p-2 border-t mt-auto flex flex-column gap-2">
        <!-- Switch per il cambio tema (JS gestion in layout.js) -->
        <div class="theme-switch-container flex align-center justify-center p-2 radius-12 glass">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
        </div>

        <div class="footer-links flex flex-column gap-1">
            <!-- Pulsante di Logout -->
            <form th:if="${user != null}" th:action="@{/api/logout}" method="post" class="m-0">
                <button type="submit"
                    class="sidebar-link-sm flex align-center w-100 gap-2 p-2 radius-12 border-none bg-transparent cursor-pointer opacity-100">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    <span class="fw-600 text-sm">Logout</span>
                </button>
            </form>
        </div>
    </div>

</nav>

<!-- =====================================================================
     BOTTOM NAV — visibile solo su mobile (≤ 768px), max 5 voci
     ===================================================================== -->
<nav id="mobile-bottom-nav" class="mobile-bottom-nav glass shadow-soft animate-fade-in-up opacity-0">

    <!-- Voce 1: Home / Dashboard -->
    <a th:href="@{/dashboard(email=${user.email}, section='home')}"
       class="mobile-nav-item"
       th:classappend="${section == 'home' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-house"></i>
        </span>
        <span class="mobile-nav-label">Home</span>
    </a>

    <!-- Voce 2: Catalogo (Comune a tutti) -->
    <a th:href="@{/dashboard(email=${user.email}, section='catalog')}"
       class="mobile-nav-item"
       th:classappend="${section == 'catalog' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-list-ul"></i>
        </span>
        <span class="mobile-nav-label">Libreria</span>
    </a>

    <!-- Voce 3a: Edizioni (solo admin) -->
    <a th:if="${user.userDto.userRole == 'role_admin'}"
       th:href="@{/dashboard(email=${user.email}, section='edition')}"
       class="mobile-nav-item"
       th:classappend="${section == 'edition' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-book-open"></i>
        </span>
        <span class="mobile-nav-label">Manuali</span>
    </a>

    <!-- Voce 3b: Prestiti (solo utente) -->
    <a th:if="${user.userDto.userRole == 'role_user'}"
       th:href="@{/dashboard(email=${user.email}, section='rents')}"
       class="mobile-nav-item"
       th:classappend="${section == 'rents' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </span>
        <span class="mobile-nav-label">Prestiti</span>
    </a>

    <!-- Voce 4: Utenti (solo admin) -->
    <a th:if="${user.userDto.userRole == 'role_admin'}"
       th:href="@{/dashboard(email=${user.email}, section='users')}"
       class="mobile-nav-item"
       th:classappend="${section == 'users' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-users"></i>
        </span>
        <span class="mobile-nav-label">Utenti</span>
    </a>

    <!-- Voce 5a: Prestiti admin -->
    <a th:if="${user.userDto.userRole == 'role_admin'}"
       th:href="@{/dashboard(email=${user.email}, section='rents')}"
       class="mobile-nav-item"
       th:classappend="${section == 'rents' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </span>
        <span class="mobile-nav-label">Prestiti</span>
    </a>

    <!-- Voce Profilo (comune) -->
    <a th:href="@{/dashboard(email=${user.email}, section='profile')}"
       class="mobile-nav-item"
       th:classappend="${section == 'profile' ? ' mobile-nav-item--active' : ''}">
        <span class="mobile-nav-icon">
            <i class="fa-solid fa-user-gear"></i>
        </span>
        <span class="mobile-nav-label">Profilo</span>
    </a>

    <!-- Voce 5: Logout (comune) -->
    <form th:if="${user != null}" th:action="@{/api/logout}" method="post" class="m-0">
        <button type="submit" class="mobile-nav-item mobile-nav-item--btn">
            <span class="mobile-nav-icon">
                <i class="fa-solid fa-right-from-bracket"></i>
            </span>
            <span class="mobile-nav-label">Esci</span>
        </button>
    </form>

</nav>

</th:block>
