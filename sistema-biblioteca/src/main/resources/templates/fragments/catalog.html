<th:block th:fragment="catalog">
    <div th:each="book, iter : ${books}"
        class="book-card-horizontal glass radius-12 shadow-card flex animate-card p-relative"
        th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <div class="card-info-main flex-1 p-2 flex flex-column justify-center">

            <!--  Title & Author -->
            <div class="mb-2">
                <div class="flex align-center gap-2">
                    <h3 class="text-2xl italicfw-700 text-brand mb-1" th:text="${book.title}"></h3>
                    <i th:if="${user.userRole == 'role_admin'}" 
                       class="fa-solid fa-pen-to-square cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                       th:data-id="${book.bookId}"
                       th:data-title="${book.title}"
                       onclick="openEditTitlePopup(this.getAttribute('data-id'), this.getAttribute('data-title'))"
                       title="Modifica Titolo"></i>
                </div>
                <div class="flex align-center gap-2">
                    <p class="text-2xl fw-400 opacity-60 mb-3" th:text="${book.authorFullName}"></p>
                    <i th:if="${user.userRole == 'role_admin'}" 
                       class="fa-solid fa-user-pen cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                       th:data-id="${book.bookId}"
                       th:data-author="${book.authorFullName}"
                       onclick="openEditAuthorPopup(this.getAttribute('data-id'), this.getAttribute('data-author'))"
                       title="Modifica Autore"></i>
                </div>
                <div class="category-label font-mono italic tracking-widest opacity-80 uppercase"
                    th:text="${book.categoryName}">CATEGORIA</div>
            </div>

            <!-- Info book -->
            <div class="card-meta mt-auto flex align-center gap-3 opacity-70">
                <div class="flex align-center font-size-small" th:title="${book.publisherName}">
                    <i class="fa-solid fa-building-columns text-sm text-brand pr-1"></i>
                    <span class="font-mono fw-600 pr-2">Editore:</span>
                    <span th:text="${book.publisherName}" class="fw-600">Editore</span>   
                </div>
                <div class="flex align-center font-size-small">
                    <i class="fa-solid fa-calendar-check text-sm text-brand pr-1"></i>
                    <span class="font-mono fw-600 pr-2">Pubblicato il:</span>
                    <span th:text="${#temporals.format(book.publishingDate, 'dd-MM-yyyy')}" class="fw-600">Data</span>
                </div>
                <div class="flex align-center font-size-small">
                    <i class="fa-solid fa-barcode text-sm text-brand pr-1"></i>
                    <span class="font-mono fw-600 pr-2">ISBN:</span>
                    <span th:text="${book.isbnCode}" class="font-mono fw-600">ISBN</span>
                </div>
            </div>
        </div>

        <!-- Status - Returned/Del/Booking-->
        <div class="card-action-column p-1 flex flex-column justify-center align-center border-l">
            <div th:if="${user.userRole == 'role_admin'}" class="flex align-center mb-3 status-context"
                th:classappend="${book.status == 'disponibilita' ? 'status-vibrant-active' : 'status-vibrant-pending'}">

                <div class="glass-indicator radius-10 font-size-xm tracking-widest flex align-center gap-1 p-1">
                    <span th:if="${book.status.equals('disponibilita')}">Disponibile</span>
                    <span th:if="${book.status.equals('in prestito')}">In Prestito</span>
                    <span th:if="${book.status.equals('eliminato')}">Eliminato</span>
                </div>
            </div>

            <a th:if="${user.userRole != 'role_admin'}"
                th:href="@{/api/borrow(email=${user.userEmail}, bookId=${book.bookId})}"
                class="btn-modern-action pointer transition shadow-soft" style="text-decoration: none;">
                <span>Richiedi</span>
            </a>
        </div>
    </div>
</th:block>

<th:block th:fragment="edition">
    <div th:each="edition, iter : ${editions}"
        class="book-card-horizontal glass radius-12 shadow-card flex animate-card p-relative"
        th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <div class="card-info-main flex-1 p-2 flex flex-column justify-center">

            <!--  Title & Author -->
            <div class="mb-2">
                <div class="flex align-center gap-2">
                    <h3 class="text-2xl italicfw-700 text-brand mb-1" th:text="${edition.bookName}"></h3>
                    <i th:if="${user.userRole == 'role_admin'}" 
                       class="fa-solid fa-pen-to-square cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                       th:data-id="${edition.editionId}"
                       th:data-title="${edition.bookName}"
                       onclick="openEditTitlePopup(this.getAttribute('data-id'), this.getAttribute('data-title'))"
                       title="Modifica Titolo"></i>
                </div>
                <div class="flex align-center gap-2">
                    <p class="text-2xl fw-400 opacity-60 mb-3" th:text="${edition.authorName}"></p>
                    <i th:if="${user.userRole == 'role_admin'}" 
                       class="fa-solid fa-user-pen cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                       th:data-id="${edition.editionId}"
                       th:data-author="${edition.authorName}"
                       onclick="openEditAuthorPopup(this.getAttribute('data-id'), this.getAttribute('data-author'))"
                       title="Modifica Autore"></i>
                </div>
                <div class="category-label font-mono italic tracking-widest opacity-80 uppercase"
                    th:text="${edition.categoryName}">CATEGORIA</div>
            </div>

            <!-- Info book -->
            <div class="card-meta mt-auto flex align-center gap-3 opacity-70">
                <div class="flex align-center font-size-small" th:title="${edition.publisherName}">
                    <i class="fa-solid fa-building-columns text-sm text-brand pr-1"></i>
                    <span class="font-mono fw-600 pr-2">Editore:</span>
                    <span th:text="${edition.publisherName}" class="fw-600">Editore</span>
                </div>
                <div class="flex align-center font-size-small">
                    <i class="fa-solid fa-calendar-check text-sm text-brand pr-1"></i>
                    <span class="font-mono fw-600 pr-2">Pubblicato il:</span>
                    <span th:text="${#temporals.format(edition.publicationDate, 'dd-MM-yyyy')}" class="fw-600">Data</span>
                </div>
                <div class="flex align-center font-size-small">
                    <i class="fa-solid fa-barcode text-sm text-brand pr-1"></i>
                    <span class="font-mono fw-600 pr-2">ISBN:</span>
                    <span th:text="${edition.isbnCode}" class="font-mono fw-600">ISBN</span>
                </div>
            </div>
        </div>

        <div class="card-action-column p-2 flex flex-column justify-center align-center border-l gap-1">
            <div class="mb-1 status-context status-vibrant-active">
                <div class="glass-indicator radius-8 font-size-xs tracking-widest flex align-center p-2 px-8">
                    <span class="fw-700" th:text="'Quantità: ' + ${edition.quantity}"></span>
                </div>
            </div>
            <button type="button"
                th:data-title="${edition.bookName}"
                th:data-url="@{/api/addBook(email=${user.userEmail}, isbn=${edition.isbnCode}, bookName=${edition.bookName})}"
                onclick="triggerConfirmAdd(this)"
                class="w-100 btn-modern-action pointer transition shadow-soft">
                <span>Aggiungi Copia</span>
                <!-- <i class="fa-solid fa-plus-circle"></i> -->
            </button>
            <a th:href="@{/dashboard(editionId=${edition.editionId}, action='viewCopies')}"
                class="w-100 btn-modern-action pointer transition shadow-soft" style="text-decoration: none;">
                <span>Visualizza Copie</span>
                <!-- <i class="fa-solid fa-layer-group"></i> -->
            </a>
        </div>
    </div>
</th:block>
