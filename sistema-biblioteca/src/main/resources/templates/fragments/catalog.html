<th:block th:fragment="catalog">
    <div th:each="book, iter : ${books}"
        class="book-card-horizontal glass radius-12 shadow-card flex animate-card p-relative"
        th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <div class="card-info-main flex-1 p-2 flex flex-column justify-center">

            <!--  Title & Author -->
            <div class="mb-2">
                <div class="flex align-center gap-1">
                    <h3 class="text-2xl italicfw-700 text-brand mb-1" th:text="${book.editionDto.bookNameDto.title}"></h3>
                    <i th:if="${user.userDto.userRole == 'role_admin'}"
                        class="fa-solid fa-pen-to-square cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                        th:data-id="${book.editionDto.editionId}" th:data-title="${book.editionDto.bookNameDto.title}"
                        onclick="openEditTitlePopup(this.getAttribute('data-id'), this.getAttribute('data-title'), true)"
                        title="Modifica Titolo"></i>


                </div>
                <div class="flex align-center gap-1">
                    <p class="text-2xl fw-400 opacity-60 mb-3" th:text="${book.editionDto.authorDto.authorName + ' ' + book.editionDto.authorDto.authorLastName}"></p>
                    <i th:if="${user.userDto.userRole == 'role_admin'}" 
                       class="fa-solid fa-pen-to-square cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                        th:data-id="${book.editionDto.editionId}" th:data-author="${book.editionDto.authorDto.authorName + ' ' + book.editionDto.authorDto.authorLastName}"
                        onclick="openEditAuthorPopup(this.getAttribute('data-id'), this.getAttribute('data-author'), true)"
                        title="Modifica Autore"></i>

                </div>
                <div class="flex align-center gap-1">
                    <div class="category-label font-mono italic tracking-widest opacity-80 uppercase"
                        th:text="${book.editionDto.categoryDto.categoryName}">CATEGORIA</div>
                    <i th:if="${user.userDto.userRole == 'role_admin'}" 
                       class="fa-solid fa-pen-to-square cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon"
                        th:data-id="${book.editionDto.editionId}" th:data-category="${book.editionDto.categoryDto.categoryName}"
                        onclick="openEditCategoryPopup(this.getAttribute('data-id'), this.getAttribute('data-category'), true)"
                        title="Modifica Categoria"></i>
                </div>
            </div>

            <!-- Info book -->
            <div class="card-meta mt-auto flex align-center gap-3 opacity-70">
                <div class="flex align-center font-size-small" th:title="${book.editionDto.publisherDto.publisherName}">
                    <i class="fa-solid fa-building-columns text-sm text-brand pr-1"></i>
                    <label class="fw-600" title="Editore" th:text="${book.editionDto.publisherDto.publisherName}">Editore</label>
                    <i th:if="${user.userDto.userRole == 'role_admin'}"
                        class="fa-solid fa-pen-to-square cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon pl-2"
                        th:data-id="${book.editionDto.editionId}" th:data-publisher="${book.editionDto.publisherDto.publisherName}"
                        onclick="openEditPublisherPopup(this.getAttribute('data-id'), this.getAttribute('data-publisher'), true)"
                        title="Modifica Editore"></i>

                </div>
                <div class="flex align-center font-size-small">
                    <i class="fa-solid fa-calendar-check text-sm text-brand pr-1"></i>
                    <label class="fw-600" title="Pubblicato il"
                        th:text="${#temporals.format(book.editionDto.publishingDate, 'dd-MM-yyyy')}">Pubblicato il</label>
                </div>
                <div class="flex align-center font-size-small">
                    <i class="fa-solid fa-barcode text-sm text-brand pr-1"></i>
                    <label class="font-mono fw-600" title="ISBN" th:text="${book.editionDto.isbn}">ISBN</label>
                </div>
            </div>
        </div>

        <!-- Action Section -->
        <div class="card-action-column p-4 flex flex-column justify-center align-center border-l">
            <button type="button" th:if="${user.userDto.userRole == 'role_user' && book.status == 'disponibilita'}"
                th:data-title="${book.editionDto.bookNameDto.title}"
                th:data-url="@{/api/rent(email=${user.email}, bookId=${book.bookId}, bookTitle=${book.editionDto.bookNameDto.title})}"
                onclick="triggerConfirmRent(this)"
                class="w-100 btn-modern-action pointer transition shadow-soft">
                <span>Prenota</span>
            </button>
            <div th:if="${user.userDto.userRole == 'role_admin'}" class="flex flex-column gap-2 w-100">
                <button type="button"
                    th:data-url="@{/dashboard(section='bookRecords', bookId=${book.bookId})}"
                    onclick="window.location.href=this.getAttribute('data-url')"
                    class="w-100 btn-modern-action pointer transition shadow-soft">
                    <span>Registri</span>
                </button>
                <button type="button" th:if="${book.status != 'eliminato'}"
                    th:data-title="${book.editionDto.bookNameDto.title}"
                    th:data-url="@{/api/deleteBook(email=${user.email}, bookId=${book.bookId}, bookTitle=${book.editionDto.bookNameDto.title})}"
                    onclick="triggerConfirmDelete(this)"
                    class="w-100 btn-modern-action btn-danger pointer transition shadow-soft">
                    <span>Elimina</span>
                </button>
            </div>
            <div th:if="${book.status == 'in prestito'}" class="status-vibrant-pending radius-10 p-2 px-6">
                <span class="text-nm fw-600">In Prestito</span>
            </div>
            <div th:if="${book.status == 'prenotato'}" class="status-vibrant-booked radius-10 p-2 px-6">
                <span class="text-nm fw-600">Prenotato</span>
            </div>
        </div>
    </div>
</th:block>

                    <i th:if="${user.userDto.userRole == 'role_admin'}" 
                       class="fa-solid fa-pen cursor-pointer text-brand opacity-30 hover-opacity-100 transition edit-icon pl-2"

                </div>
            </div>
        </div>

        <div class="card-action-column p-2 flex flex-column justify-center align-center border-l gap-1">
            <div class="mb-1 status-context status-vibrant-active">
                <div class="glass-indicator radius-8 font-size-xs  flex align-center p-2 px-8">
                    <span class="fw-700" th:text="'Quantità: ' + ${edition.quantity}"></span>
                </div>
            </div>
            <button type="button" th:data-title="${edition.bookNameDto.title}"
                th:data-url="@{/api/addBook(email=${user.email}, isbn=${edition.isbn}, bookName=${edition.bookNameDto.title})}"
                onclick="triggerConfirmAdd(this)" class="w-100 btn-modern-action pointer transition shadow-soft">
                <span>Aggiungi Copia</span>
                <!-- <i class="fa-solid fa-plus-circle"></i> -->
            </button>
            <a th:href="@{/dashboard(editionId=${edition.editionId}, action='viewCopies', includeDeleted=true)}"
                class="w-100 btn-modern-action pointer transition shadow-soft" style="text-decoration: none;">
                <span>Visualizza Copie</span>
                <!-- <i class="fa-solid fa-layer-group"></i> -->
            </a>
        </div>
    </div>
</th:block>
