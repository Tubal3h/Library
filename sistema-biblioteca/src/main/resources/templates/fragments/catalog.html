<th:block th:fragment="catalog">
    <div
        th:each="book, iter : ${books}"
        class="book-card-horizontal glass radius-24 p-0 shadow-card flex border-none animate-card overflow-hidden"
        
        th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">
        
        <div class="card-info-main flex-1 p-1 flex flex-column">

            <!--  Title & Author -->
            <div class="mb-3">
                <h3 class="text-xl text-brand" th:text="${book.title}"></h3>
                <p class="text-xl opacity-50" th:text="${book.authorFullName}"></p>
                <div class="category-label font-mono text-lg tracking-widest opacity-40" th:text="${book.categoryName}">CATEGORIA</div>
            </div>

            <!-- Info book -->
            <div class="card-meta mt-auto flex align-center gap-1 opacity-50">
                <div class="flex align-center gap-1 font-size-small" th:title="${book.publisherName}">
                    <i class="fa-solid fa-building-columns text-xs text-brand"></i>
                    <span th:text="${book.publisherName}" class="text-truncate" style="max-width: 80px;">Editore</span>
                </div>
                <div class="flex align-center gap-1 font-size-small">
                    <i class="fa-solid fa-calendar-check text-xs text-brand"></i>
                    <span th:text="${book.publishingDate}">Data</span>
                </div>
                <div class="flex align-center gap-1 font-size-small">
                    <i class="fa-solid fa-barcode text-xs text-brand"></i>
                    <span th:text="${book.isbnCode}" class="font-mono">ISBN</span>
                </div>
            </div>
        </div>

        <!-- Status - Returned/Del/Booking-->
        <div class="card-action-column p-2 flex flex-column justify-center border-l">
            <div th:if="${user.userRole == 'role_admin'}" class="flex align-center mb-1 status-context" 
                th:classappend="${book.status == 'disponibilita' ? 'status-vibrant-active' : 'status-vibrant-pending'}">
                <div class="glass-indicator radius-10 font-size-xs tracking-widest flex align-center gap-1 p-1">
                    <span th:if="${book.status == 'disponibilita'}">Disponibile</span>
                    <span th:if="${book.status != 'disponibilita'}">In Prestito</span>
                </div>
            </div>
            <button th:if="${user.userRole == 'role_admin'}" class="m-1 btn-modern-action pointer transition shadow-soft">
                <span class="text-center">Elimina</span>
            </button>
            <a th:if="${user.userRole != 'role_admin'}" th:href="@{/api/borrow(email=${user.userEmail}, bookId=${book.bookId})}" class="btn-modern-action pointer transition shadow-soft" style="text-decoration: none;">
                <span>Prenota</span>
            </a>
        </div>
    </div>
</th:block>
