<!-- 
    -------------------------------------------------------------------------
    USERS FRAGMENT (USERS.HTML)
    -------------------------------------------------------------------------
    Visualizza l'elenco degli utenti registrati nel sistema.
    Mostra il ruolo (User/Admin), il nome completo, l'email e l'ID univoco.
    Solo gli amministratori possono visualizzare ed eseguire azioni su questa lista.
-->
<th:block th:fragment="users">
    <!-- Contenitore delle Card Utente -->
    <div th:each="user, iter : ${users}"
        class="book-card-horizontal glass radius-12 p-0 shadow-card flex border-none animate-card overflow-hidden"
        th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <!-- Colonna Sinistra: Informazioni Utente (Profilo e Ruolo) -->
        <div class="card-info-main flex-1 p-2 flex flex-column">

            <!-- Badge Ruolo -->
            <div class="flex align-end mb-1 status-context status-vibrant-active">
                <div class="glass-indicator radius-8  flex align-center gap-1 p-1">
                    <p class="text-sm" th:text="${user.userRole != 'role_admin' ? 'Dipendente' : 'Amministratore'}">RUOLO
                    </p>
                </div>
            </div>

            <!-- Nome e Cognome -->
            <div class="mb-5">
                <a th:href="@{'/api/navigation/userRecords/' + ${user.userId}}" class="no-underline">
                    <h3 class="text-2xl fw-700 text-brand mb-1 cursor-pointer hover-opacity-100 transition" 
                        th:text="${user.userName} + ' ' + ${user.userLastName}"></h3>
                </a>
            </div>

            <!-- Metadati: Email e User ID -->
            <div class="card-meta mt-auto flex align-center gap-4 opacity-50">
                <div class="flex align-center gap-2 ">
                    <i class="fa-solid fa-envelope text-NM text-brand"></i>
                    <span th:text="${user.userEmail}">Email</span>
                </div>
                <div class="flex align-center gap-2 ">
                    <i class="fa-solid fa-id-badge text-NM text-brand"></i>
                    <span th:text="'User ID: ' + ${user.userId}" class="font-mono">ID</span>
                </div>
            </div>
        </div>

        <!-- Colonna Destra: Azioni Administrative (Eliminazione) -->
        <div class="card-action-column p-2 flex flex-column justify-center border-l">
            <button th:if="${user.userRole != 'role_admin'}"
                    type="button"
                    class="w-100 btn-modern-action pointer transition shadow-soft flex align-center gap-2"
                    th:data-title="${user.userName} + ' ' + ${user.userLastName}"
                    th:data-url="'/api/deleteUser?userId=' + ${user.userId} + '&userName=' + ${#uris.escapeQueryParam(user.userName + ' ' + user.userLastName)}"
                    onclick="triggerConfirmDeleteUser(this)"
                    title="Elimina profilo">
                <span>Elimina profilo</span>
            </button>
        </div>
    </div>
</th:block>
