<!-- 
    -------------------------------------------------------------------------
    RENTS FRAGMENT (RENTS.HTML)
    -------------------------------------------------------------------------
    Visualizza l'elenco dei prestiti (record di noleggio) attivi o storici.
    Le card mostrano le date di inizio/scadenza, l'ISBN del libro e l'ID utente.
    Gli amministratori dispongono di azioni per segnare il libro come restituito.
-->
<th:block th:fragment="rents">
    <!-- Barra dei Filtri -->
    <div class="rents-filter-wrapper animate-fade-in-up mb-6 opacity-0 delay-1">
        <div class="popup-filter-bar flex-wrap">
            <button type="button" class="filter-chip active" data-filter="all" onclick="filterRents(this)">
                <i class="fa-solid fa-layer-group"></i> Tutti
            </button>
            <button type="button" class="filter-chip" data-filter="prenotato" onclick="filterRents(this)">
                <i class="fa-solid fa-clock" style="color: #2e10d9;"></i> Prenotati
            </button>
            <button type="button" class="filter-chip" data-filter="in-prestito" onclick="filterRents(this)">
                <i class="fa-solid fa-book-open-reader" style="color: var(--color-warning);"></i> In Prestito
            </button>
            <button type="button" class="filter-chip" data-filter="expired" onclick="filterRents(this)">
                <i class="fa-solid fa-circle-exclamation" style="color: var(--color-error);"></i> Scaduti
            </button>
        </div>
    </div>

    <!-- Contenitore delle Card dei Prestiti -->
    <div th:each="rent, iter : ${rentedBooks}"
        th:with="todayStr=${#temporals.format(#temporals.createNow(), 'yyyyMMdd')}, rentDateStr=${rent.rentalExpired != null ? #temporals.format(rent.rentalExpired, 'yyyyMMdd') : '99999999'}, isExpired=${rent.rentalEnded == null && rentDateStr < todayStr}"
        th:data-status="${rent.bookDto != null && rent.bookDto.status != null ? #strings.replace(rent.bookDto.status, ' ', '-') : 'unknown'}"
        th:data-expired="${isExpired}"
        class="book-card-horizontal glass radius-12 shadow-card flex animate-card p-relative"
        th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <!-- Colonna Sinistra: Informazioni sul Libro e sul Prestito -->
        <div class="card-info-main flex-1 p-2 flex flex-column justify-center">

            <!-- Titolo e Autore del Libro -->
            <div class="mb-2">
                <div class="flex justify-row gap-2">
                    <h3 class="text-2xl italic fw-700 text-brand mb-1"
                        th:text="${rent.bookDto != null ? rent.bookDto.editionDto.bookNameDto.title : 'N/A'}"></h3>
                    <p class="text-2xl fw-400 opacity-60 mb-3"
                        th:text="${rent.bookDto != null ? rent.bookDto.editionDto.authorDto.authorName + ' ' + rent.bookDto.editionDto.authorDto.authorLastName : 'N/A'}"></p>
                </div>
                <div class="flex align-center gap-2">
                    <div th:if="${user.userDto.userRole == 'role_admin'}"
                        class="category-label font-mono italic opacity-80 uppercase"
                        th:text="${rent.bookDto != null ? rent.bookDto.editionDto.categoryDto.categoryName : 'ALTRO'}">CATEGORIA</div>
                </div>
            </div>

            <!-- Righe Metadati: Date, ISBN e User ID -->
            <div class="card-meta mt-auto flex align-center gap-3 opacity-70">
                <!-- Data Prenotazione -->
                <div th:if="${rent.bookDto != null && rent.bookDto.status == 'prenotato'}"
                    class="flex align-center font-size-small">
                    <i class="fa-solid fa-calendar-plus text-sm text-brand pr-1"></i>
                    <label class="fw-600" title="Data Prenotazione"
                        th:text="${#temporals.format(rent.bookingDate, 'dd-MM-yyyy')}">Data Prenotazione</label>
                </div>

                <!-- Data di Inizio Noleggio -->
                <div th:if="${rent.bookDto != null && rent.bookDto.status != 'prenotato'}"
                    class="flex align-center font-size-small">
                    <i class="fa-solid fa-calendar-check text-sm text-brand pr-1"></i>
                    <label class="fw-600" title="Data inizio prestito"
                        th:text="${#temporals.format(rent.rentalDate, 'dd-MM-yyyy')}">Inizio</label>
                </div>

                <!-- Data di Scadenza -->
                <div th:if="${rent.bookDto != null && rent.bookDto.status != 'prenotato'}"
                    class="flex align-center font-size-small">
                    <i class="fa-regular fa-clock text-sm text-brand pr-1"></i>
                    <label class="fw-600" title="Data scadenza prestito"
                        th:text="${#temporals.format(rent.rentalExpired, 'dd-MM-yyyy')}">Scadenza</label>
                </div>

                <!-- Codice ISBN -->
                <div th:if="${user.userDto.userRole == 'role_admin' and rent.bookDto != null}"
                    class="flex align-center font-size-small">
                    <i class="fa-solid fa-barcode text-sm text-brand pr-1"></i>
                    <label class="font-mono fw-600" title="Codice ISBN" th:text="${rent.bookDto.editionDto.isbn}">ISBN</label>
                </div>

                <!-- ID Utente (Utile per gli Admin) -->
                <div th:if="${user.userDto.userRole == 'role_admin'}" class="flex align-center font-size-small">
                    <i class="fa-solid fa-user text-sm text-brand pr-1"></i>
                    <label class="fw-600" title="Dipendente"
                        th:text="${rent.userDto.userName + ' ' + rent.userDto.userLastName}">USER</label>
                </div>
            </div>
        </div>

        <!-- Colonna Destra: Stato e Azioni Gestionali -->
        <div class="card-action-column p-4 flex flex-column justify-center align-center border-l">

            <!-- Sezione visibile solo agli Amministratori -->
            <div class="w-100 flex flex-column align-center">

                <!-- Indicatore di Stato Dinamico (Restituito, Da Restituire, Scaduto) -->
                <div class="mb-3 status-context"
                    th:classappend="${isExpired ? 'status-vibrant-error' : (rent.bookDto != null && rent.bookDto.status == 'in prestito' ? 'status-vibrant-pending' : 'status-vibrant-booked')}">

                    <div class="glass-indicator radius-10 text-nm tracking-widest flex align-center gap-1 p-2 px-8">
                        <div class="dot mr-1"></div>
                        <span th:if="${rent.bookDto != null && rent.bookDto.status == 'prenotato'}"
                            th:text="'Prenotato'">STATO</span>
                        <span th:if="${rent.bookDto != null && rent.bookDto.status == 'in prestito' && !isExpired}"
                            th:text="'In Prestito'">STATO</span>
                        <span th:if="${rent.bookDto != null && rent.bookDto.status == 'in prestito' && isExpired}"
                            th:text="'Scaduto'">STATO</span>
                    </div>
                </div>

                <!-- Pulsante per confermare la restituzione (Consegnato) con Popup -->
                <button type="button"
                    th:if="${rent.bookDto != null && rent.bookDto.status == 'prenotato' && user.userDto.userRole == 'role_admin'}"
                    th:data-title="${rent.bookDto.editionDto.bookNameDto.title}"
                    th:data-url="@{/api/delivered(bookID=${rent.bookDto.bookId}, rentID=${rent.rentalId}, bookTitle=${rent.bookDto.editionDto.bookNameDto.title})}"
                    onclick="triggerConfirmDelivered(this)"
                    class="w-100 btn-modern-action pointer transition shadow-soft">
                    <span>Conferma prestito</span>
                </button>
                <button type="button"
                    th:if="${rent.bookDto != null && rent.bookDto.status == 'in prestito' && user.userDto.userRole == 'role_admin'}"
                    th:data-title="${rent.bookDto.editionDto.bookNameDto.title}"
                    th:data-url="@{/api/returned(bookID=${rent.bookDto.bookId}, rentID=${rent.rentalId}, bookTitle=${rent.bookDto.editionDto.bookNameDto.title})}"
                    onclick="triggerConfirmReturned(this)"
                    class="w-100 btn-modern-action pointer transition shadow-soft">
                    <span>Riconsegnato</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script specifico per i noleggi -->
    <script th:src="@{/js/fragments/rents.js}"></script>
</th:block>
