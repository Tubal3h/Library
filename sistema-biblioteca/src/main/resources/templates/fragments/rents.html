<th:block th:fragment="rents">
    <!-- Rental Record Cards -->
    <div th:each="rent, iter : ${rentedBooks}"
         class="book-card-horizontal glass radius-24 p-0 shadow-card flex border-none animate-card overflow-hidden"
         th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <!-- Left Column: Information (75%) -->
        <div class="card-info-main p-2 flex flex-row">
            <!-- Header: Category & Status Badge -->

            <div>
                <!-- Middle: Book Title & Author -->
                <div class="mb-5">
                    <h3 class="text-xl text-brand" th:text="${rent.book != null ? rent.book.title : 'N/A'}"></h3>
                    <p class="text-xl opacity-60" th:text="${rent.book != null ? rent.book.authorFullName : 'N/A'}"></p>
                    <div th:classappend="${rent.rentalEnded != null ? 'status-vibrant-active' : 'status-vibrant-pending'}">
                        <span class="category-label font-mono text-lg fw-500 tracking-widest opacity-40" th:text="${rent.book != null ? rent.book.categoryName : 'ALTRO'}">CATEGORIA</span>
                    </div>
                </div>

                <!-- Meta: Dates Row -->
                <div class="card-meta mt-auto flex align-center gap-4 opacity-50">
                    <div class="flex align-center gap-1 font-size-small">
                        <span>Preso</span>
                        <span th:text="${rent.rentalDate}">Inizio</span>
                    </div>
                    <div class="flex align-center gap-2 font-size-small">
                        <span>Da consegnare</span>
                        <span th:text="${rent.rentalExpired}">Scadenza</span>
                    </div>
                    <div class="flex align-center gap-2 font-size-small" th:if="${rent.book != null}">
                        <span>ISBN</span>
                        <span th:text="${rent.book.isbnCode}" class="font-mono">ISBN</span>
                    </div>
                    <div class="flex align-center gap-2 font-size-small">
                        <i class="fa-solid fa-user text-xs text-brand"></i>
                        <span th:text="'User ID: ' + ${rent.userId}" class="font-mono">USER</span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${user.userRole == 'role_admin'}"  class="card-action-column p-2 flex justify-center align-center border-l text-center">
            <div class="glass-indicator radius-10 font-size-xs fw-800 tracking-widest flex align-center  mt-3 mb-3 gap-1 p-1">
                <span th:if="${rent.rentalDate.isBefore(rent.rentalExpired) || rent.rentalDate.isEqual(rent.rentalExpired)}"
                    th:text="${rent.rentalEnded != null ? 'Restituito' : 'Da Restituire'}">STATO</span>

                <span th:if="${rent.rentalDate.isAfter(rent.rentalExpired)}"
                    th:text="${rent.rentalEnded != null ? 'Restituito' : 'Scaduto'}">STATO</span>
            </div>
            <a th:href="@{/api/delivered(email=${user.userEmail}, bookID=${rent.bookId}, rentID=${rent.rentId})}" class="btn-modern-action pointer transition shadow-soft" style="text-decoration: none;">
                <span>Consegnato</span>
            </a>
        </div>
    </div>
</th:block>
