<th:block th:fragment="rents">
    <!-- Rental Record Cards -->
    <div th:each="rent, iter : ${rentedBooks}"
         class="book-card-horizontal glass radius-24 shadow-card flex animate-card p-relative"
         th:style="'--delay: ' + (${iter.index} * 0.1) + 's;'">

        <!-- Left Column: Information -->
        <div class="card-info-main flex-1 p-5 flex flex-column justify-center">

            <!-- Book Title & Author -->
            <div class="mb-4">
                <h3 class="text-3xl fw-700 text-brand mb-1" th:text="${rent.book != null ? rent.book.title : 'N/A'}"></h3>
                <p class="text-xl fw-400 opacity-60 mb-3" th:text="${rent.book != null ? rent.book.authorFullName : 'N/A'}"></p>
                <div class="category-label font-mono text-sm tracking-widest opacity-80 uppercase" th:text="${rent.book != null ? rent.book.categoryName : 'ALTRO'}">CATEGORIA</div>
            </div>

            <!-- Dates Row -->
            <div class="card-meta mt-auto flex align-center gap-4 opacity-70">
                <div class="flex align-center gap-2 font-size-small">
                    <i class="fa-solid fa-calendar-arrow-up text-sm text-brand"></i>
                    <span>Preso:</span>
                    <span th:text="${rent.rentalDate}" class="fw-600">Inizio</span>
                </div>
                <div class="flex align-center gap-2 font-size-small">
                    <i class="fa-solid fa-calendar-arrow-down text-sm text-brand"></i>
                    <span>Scadenza:</span>
                    <span th:text="${rent.rentalExpired}" class="fw-600">Scadenza</span>
                </div>
                <div class="flex align-center gap-2 font-size-small" th:if="${rent.book != null}">
                    <i class="fa-solid fa-barcode text-sm text-brand"></i>
                    <span th:text="${rent.book.isbnCode}" class="font-mono fw-600">ISBN</span>
                </div>
                <div class="flex align-center gap-2 font-size-small">
                    <i class="fa-solid fa-user text-sm text-brand"></i>
                    <span th:text="'User ID: ' + ${rent.userId}" class="font-mono fw-600">USER</span>
                </div>
            </div>
        </div>

        <div class="card-action-column p-4 flex flex-column justify-center align-center border-l">
            <!-- Container Admin -->
            <div th:if="${user.userRole == 'role_admin'}" class="w-100 flex flex-column align-center">
                <div class="mb-3 status-context"
                     th:classappend="${rent.rentalEnded != null ? 'status-vibrant-active' : (rent.rentalDate.isAfter(rent.rentalExpired) ? 'status-vibrant-error' : 'status-vibrant-pending')}">
                    
                    <div class="glass-indicator radius-10 font-size-xs tracking-widest flex align-center gap-2 p-2 px-8">
                        <div class="dot"></div>
                        <span th:if="${rent.rentalDate.isBefore(rent.rentalExpired) || rent.rentalDate.isEqual(rent.rentalExpired)}"
                            th:text="${rent.rentalEnded != null ? 'Restituito' : 'Da Restituire'}">STATO</span>

                        <span th:if="${rent.rentalDate.isAfter(rent.rentalExpired)}"
                            th:text="${rent.rentalEnded != null ? 'Restituito' : 'Scaduto'}">STATO</span>
                    </div>
                </div>
                
                <a th:href="@{/api/delivered(email=${user.userEmail}, bookID=${rent.bookId}, rentID=${rent.rentId})}" class="w-100 btn-modern-action pointer transition shadow-soft" style="text-decoration: none;">
                    <span>Consegnato</span>
                    <i class="fa-solid fa-check"></i>
                </a>
            </div>
        </div>
    </div>
</th:block>
