<div th:fragment="popup" id="genericPopup" class="popup-overlay none" onclick="closePopupOnBackdrop(event)">
    <div class="popup-content animate-fade-in-up" onclick="event.stopPropagation()">

        <!-- Header Section -->
        <div class="popup-header flex justify-between align-center">
            <div class="flex align-center gap-4">
                <div class="icon-box-accent">
                    <i id="popupIcon" class="fa-solid fa-pen-to-square text-white"></i>
                </div>
                <h3 id="popupTitle" class="text-3xl fw-700 text-brand">Modifica Dati</h3>
            </div>
            <button type="button" class="btn-icon-close" onclick="closePopup()" title="Chiudi">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Body Section -->
        <div id="" class="popup-body">
            <!-- Edit Panels -->
            <div th:replace="~{fragments/popupFragments/editBookContent :: editBookContent}"></div>
            <div th:replace="~{fragments/popupFragments/editFieldOnlyContent :: editFieldOnlyContent}"></div>
            
            <!-- Success/Feedback Panels -->
            <div th:replace="~{fragments/popupFragments/successPanels :: successPanels}"></div>
            
            <!-- Add Entity Panels -->
            <div th:replace="~{fragments/popupFragments/addPanels :: addPanels}"></div>

            <!-- Update Entity Panels (Settings) -->
            <div th:replace="~{fragments/popupFragments/updatePanels :: updatePanels}"></div>

            <!-- Utility Panels (Confirm, Error, User, Copies) -->
            <div th:replace="~{fragments/popupFragments/utilityPanels :: utilityPanels}"></div>
        </div>

        <!-- Footer Section -->
        <div class="popup-footer">
            <button type="button" class="btn-link-action" onclick="closePopup()">Annulla</button>
            <button type="button" id="popupConfirmBtn">Conferma</button>
        </div>

        <!-- Bridge Script -->
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => {
                const showCopies = /*[[${showCopiesPopup}]]*/ false;
                if (showCopies && typeof initServerSidePopup === 'function') initServerSidePopup();

                const popupType = /*[[${popupType}]]*/ null;
                if (popupType && typeof initSuccessPopup === 'function') {
                    initSuccessPopup(popupType, {
                        title: /*[[${popupBookTitle}]]*/ null,
                        isbn: /*[[${popupBookIsbn}]]*/ null,
                        authorName: /*[[${popupAuthorName}]]*/ null,
                        authorLastName: /*[[${popupAuthorLastName}]]*/ null,
                        publisherName: /*[[${popupPublisherName}]]*/ null,
                        categoryName: /*[[${popupCategoryName}]]*/ null,
                        errorMessage: /*[[${popupErrorMessage}]]*/ null
                    });
                }
            });
        </script>

        <!-- Scripts per i Frammenti (Gestiti ora in layout.html) -->



        <!-- Data Sources -->
        <div style="display:none">
            <ul id="categoryDataSource"><li th:each="c : ${categories}" th:text="${c.categoryName}" th:data-id="${c.categoryId}"></li></ul>
            <ul id="titleDataSource"><li th:each="bn : ${bookNames}" th:text="${bn.title}" th:data-id="${bn.bookNameId}"></li></ul>
            <ul id="publisherDataSource"><li th:each="p : ${publishers}" th:text="${p.publisherName}" th:data-id="${p.publisherId}"></li></ul>
            <ul id="authorDataSource"><li th:each="a : ${authors}" th:data-first="${a.authorName}" th:data-last="${a.authorLastName}" th:data-id="${a.authorId}" th:text="${a.authorName + ' ' + a.authorLastName}"></li></ul>
        </div>
    </div>
</div>
