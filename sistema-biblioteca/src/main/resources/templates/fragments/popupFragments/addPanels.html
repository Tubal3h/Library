<div th:fragment="addPanels">
    <!-- Add Title -->
    <div id="addTitleContent" class="none animate-fade-in-up">
        <p class="mb-6 opacity-70 text-lg ">Inserisci il titolo per un nuovo manuale.</p>
        <form id="addTitleForm" th:action="@{/api/addBookName}" method="post">
            <div class="input-group">
                <label class="text-xs uppercase fw-700 opacity-60 mb-2 block ">Titolo manuale</label>
                <input type="text" name="title" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Es: Programmare in..." required>
            </div>
        </form>
    </div>

    <!-- Add Author -->
    <div id="addAuthorContent" class="none animate-fade-in-up">
        <p class="mb-6 opacity-70 text-lg ">Inserisci i dati per un nuovo autore.</p>
        <form id="addAuthorForm" th:action="@{/api/addAuthor}" method="post">
            <div class="flex flex-column gap-5">
                <div class="input-group">
                    <label class="text-xs uppercase fw-700 opacity-60 mb-2 block ">Nome</label>
                    <input type="text" name="authorName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Es: Mario" required>
                </div>
                <div class="input-group">
                    <label class="text-xs uppercase fw-700 opacity-60 mb-2 block ">Cognome</label>
                    <input type="text" name="authorLastName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Es: Rossi" required>
                </div>
            </div>
        </form>
    </div>

    <!-- Add Publisher -->
    <div id="addPublisherContent" class="none animate-fade-in-up">
        <p class="mb-6 opacity-70 text-lg ">Inserisci il nome del nuovo editore.</p>
        <form id="addPublisherForm" th:action="@{/api/addPublisher}" method="post">
            <div class="input-group">
                <label class="text-xs uppercase fw-700 opacity-60 mb-2 block ">Nome editore</label>
                <input type="text" name="publisherName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Es: Apogeo" required>
            </div>
        </form>
    </div>

    <!-- Add Category -->
    <div id="addCategoryContent" class="none animate-fade-in-up">
        <p class="mb-6 opacity-70 text-lg ">Inserisci il nome della nuova categoria.</p>
        <form id="addCategoryForm" th:action="@{/api/addCategory}" method="post">
            <div class="input-group">
                <label class="text-xs uppercase fw-700 opacity-60 mb-2 block ">Nome categoria</label>
                <input type="text" name="categoryName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Es: Java" required>
            </div>
        </form>
    </div>

    <!-- Add Edition (Complex) -->
    <div id="addEditionContent" class="none animate-fade-in-up">
        <form id="addEditionForm" th:action="@{/api/addEdition}" method="post">
            <input type="hidden" name="email" th:value="${user != null ? user.email : ''}">
            <div class="flex flex-column gap-5">
                <div class="input-group relative">
                    <label class="text-xs uppercase fw-700 opacity-60  block ">Titolo</label>
                    <input type="text" id="addEditionTitleInput" name="title" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Esempio: Programmare in Java" required>
                    <div id="addEditionTitleSuggestions" class="suggestions-dropdown none"></div>
                </div>
                
                <div class="popup-grid-3">
                    
                    <div class="input-group relative">
                        <label class="text-xs uppercase fw-700 opacity-60  block ">Nome Autore</label>
                        <input type="text" id="addEditionAuthorNameInput" name="authorName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Mario" required>
                        <div id="addEditionAuthorSuggestions" class="suggestions-dropdown none"></div>
                    </div>
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60  block ">Cognome Autore</label>
                        <input type="text" id="addEditionAuthorLastNameInput" name="authorLastName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Rossi" required>
                    </div>
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60  block ">Categoria</label>
                        <select name="categoryName" class="w-100 p-4 radius-12 border-none font-size-small cursor-pointer" required>
                            <option value="">Scegli...</option>
                            <option th:each="c : ${categories}" th:value="${c.categoryName}" th:text="${c.categoryName}"></option>
                        </select>
                    </div>
                </div>

                <div class="popup-grid-3">
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60  block ">ISBN (13 cifre)</label>
                        <input type="text" name="isbn" class="w-100 p-4 radius-12 border-none font-size-small font-mono" placeholder="9788845292613" maxlength="13" required>
                    </div>
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60 mb-2 block ">Data Pubblicazione</label>
                        <input type="date" name="localDate" class="w-100 p-4 radius-12 border-none font-size-small cursor-pointer" required>
                    </div>
                    <div class="input-group relative">
                        <label class="text-xs uppercase fw-700 opacity-60  block ">Editore</label>
                        <input type="text" id="addEditionPublisherInput" name="publisherName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Esempio: Mondadori" required>
                        <div id="addEditionPublisherSuggestions" class="suggestions-dropdown none"></div>
                    </div>
                </div>

                
            </div>
        </form>
    </div>
</div>
