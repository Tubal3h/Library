<div th:fragment="utilityPanels">
    <!-- Confirm -->
    <div id="confirmContent" class="none animate-fade-in-up text-center py-6">
        <h3 id="confirmTitle" class="text-2xl fw-700 text-brand mb-2">Attenzione</h3>
        <p id="confirmMessage" class="opacity-70 text-sm leading-relaxed px-6">Confermi l'operazione?</p>
        <div id="confirmDetails" class="mt-4 p-4 radius-12 bg-darkgrey font-size-small opacity-80" style="display: none;"></div>
    </div>

    <!-- Error -->
    <div id="errorContent" class="none animate-fade-in-up text-center py-4">
        <div class="flex justify-center mb-5">
            <div class="popup-feedback-icon" style="background: rgba(198,40,40,0.08); color: var(--color-error);"><i class="fa-solid fa-circle-exclamation"></i></div>
        </div>
        <h3 class="text-2xl fw-700 mb-2" style="color: var(--color-error);">Operazione fallita</h3>
        <p class="opacity-70 text-sm leading-relaxed"><strong id="errorMessage" class="text-brand"></strong></p>
    </div>

    <!-- Add User -->
    <div id="addUserContent" class="none animate-fade-in-up">
        <form id="addUserForm" th:action="@{/api/addUser}" method="post" novalidate>
            <div class="flex flex-column gap-5">
                <div class="add-user-row">
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Nome</label>
                        <input type="text" id="addUserNameInput" name="userName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Mario" required oninput="updateAddUserEmailPreview()">
                    </div>
                    <div class="input-group">
                        <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Cognome</label>
                        <input type="text" id="addUserLastNameInput" name="userLastName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Rossi" required oninput="updateAddUserEmailPreview()">
                    </div>
                </div>
                <div class="input-group">
                    <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Mail Aziendale</label>
                    <div class="add-user-preview-field radius-12">
                        <i class="fa-solid fa-envelope add-user-preview-icon"></i>
                        <span id="addUserEmailPreview" class="add-user-preview-text font-mono">nome.cognome@biblioteca.it</span>
                    </div>
                </div>
                <div class="input-group">
                    <label class="text-xs uppercase fw-700 opacity-60 mb-2 block tracking-widest">Ruolo</label>
                    <div class="add-user-role-grid">
                        <label class="role-option" id="roleOptionUser">
                            <input type="radio" name="userRole" value="role_user" checked onchange="updateRoleSelection()">
                            <div class="role-card"><span class="role-label">Dipendente</span></div>
                        </label>
                        <label class="role-option" id="roleOptionAdmin">
                            <input type="radio" name="userRole" value="role_admin" onchange="updateRoleSelection()">
                            <div class="role-card"><span class="role-label">Amministratore</span></div>
                        </label>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- View Copies List -->
    <div id="viewBooksEditionContent" class="none animate-fade-in-up">
        <h3 id="viewBooksEditionTitle" class="text-xl fw-700 text-brand mb-4" th:text="${popupEditionTitle}">Titolo Edizione</h3>
        <div class="popup-table-wrap">
            <table class="w-100 border-collapse">
                <thead>
                    <tr class="text-center border-b opacity-60">
                        <th class="text-xs uppercase tracking-widest fw-700">ID Libro</th>
                        <th class="text-xs uppercase tracking-widest fw-700">Stato</th>
                        <th class="text-xs uppercase tracking-widest fw-700 text-right">Azioni</th>
                    </tr>
                </thead>
                <tbody id="viewBooksListContainer" th:fragment="bookCopiesList">
                    <tr th:each="book : ${popupBooks != null ? popupBooks : books}" class="text-center border-b hover-bg-light transition">
                        <td class="p-3 font-mono fw-600 text-brand">#[[${book.bookId}]]</td>
                        <td>
                            <div class="glass-indicator radius-4 p-1 font-size-xs fw-700 uppercase" th:text="${book.status}">STATO</div>
                        </td>
                        <td class="text-right">
                            <button th:if="${book.status == 'disponibilita'}" type="button" class="btn-modern-action" th:data-title="${popupEditionTitle}" th:data-url="'/api/deleteBook?bookId=' + ${book.bookId}" onclick="triggerConfirmDelete(this)">Elimina</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
