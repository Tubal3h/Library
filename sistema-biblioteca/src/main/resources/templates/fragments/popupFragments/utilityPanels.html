<div th:fragment="utilityPanels">
    <!-- Confirm -->
    <div id="confirmContent" class="none animate-fade-in-up text-center py-6">
        <h3 id="confirmTitle" class="text-2xl fw-700 text-brand mb-2">Attenzione</h3>
        <p id="confirmMessage" class="opacity-70 text-xl  px-6">Confermi l'operazione?</p>
        <div id="confirmDetails" class="mt-4 p-4 radius-12 bg-darkgrey text-xl opacity-80" style="display: none;"></div>
    </div>

    <!-- Error -->
    <div id="errorContent" class="none animate-fade-in-up text-center py-4">
        <div class="flex justify-center mb-5">
            <div class="popup-feedback-icon" style="background: rgba(198,40,40,0.08); color: var(--color-error);"><i class="fa-solid fa-circle-exclamation"></i></div>
        </div>
        <h3 class="text-2xl fw-700 mb-2" style="color: var(--color-error);">Operazione fallita</h3>
        <p class="opacity-70 text-xl "><strong id="errorMessage" class="text-brand"></strong></p>
    </div>

    <!-- Add User -->
    <div id="addUserContent" class="none animate-fade-in-up">
        <form id="addUserForm" th:action="@{/api/addUser}" method="post" novalidate>
            <div class="flex flex-column gap-5">
                <div class="add-user-row">
                    <div class="input-group">
                        <label class="text-nm uppercase fw-700 opacity-60 mb-1 block ">Nome</label>
                        <input type="text" id="addUserNameInput" name="userName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Mario" required oninput="updateAddUserEmailPreview()">
                    </div>
                    <div class="input-group">
                        <label class="text-nm uppercase fw-700 opacity-60 mb-1 block ">Cognome</label>
                        <input type="text" id="addUserLastNameInput" name="userLastName" class="w-100 p-4 radius-12 border-none font-size-small" placeholder="Rossi" required oninput="updateAddUserEmailPreview()">
                    </div>
                </div>
                <div class="input-group">
                    <label class="text-nm uppercase fw-700 opacity-60 mb-1 block ">Mail Aziendale</label>
                    <div class="add-user-preview-field radius-12">
                        <i class="fa-solid fa-envelope add-user-preview-icon"></i>
                        <span id="addUserEmailPreview" class="add-user-preview-text font-mono">nome.cognome@biblioteca.it</span>
                    </div>
                </div>
                <div class="input-group">
                    <label class="text-nm uppercase fw-700 opacity-60 mb-1 block ">Ruolo</label>
                    <div class="add-user-role-grid">
                        <label class="role-option" id="roleOptionUser" >
                            <input type="radio" name="userRole" value="role_user" checked onchange="updateRoleSelection()">
                            <div class="role-card"><span class="role-label">Dipendente</span></div>
                        </label>
                        <label class="role-option" id="roleOptionAdmin">
                            <input type="radio" name="userRole" value="role_admin" onchange="updateRoleSelection()">
                            <div class="role-card"><span class="role-label">Amministratore</span></div>
                        </label>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- View Copies List -->
    <div id="viewBooksEditionContent" class="none animate-fade-in-up">
        <h3 id="viewBooksEditionTitle" class="text-xl fw-700 text-brand mb-4" th:text="${popupEditionTitle}">Titolo Edizione</h3>
        
        <!-- Filter Bar -->
        <div class="popup-filter-bar mb-5 flex-wrap">
            <button type="button" class="filter-chip active" data-filter="all" onclick="filterBookCopies(this)">
                <i class="fa-solid fa-layer-group"></i> Tutti
            </button>
            <button type="button" class="filter-chip" data-filter="disponibilita" onclick="filterBookCopies(this)">
                <i class="fa-solid fa-circle-check" style="color: var(--color-success);"></i> Disponibili
            </button>
            <button type="button" class="filter-chip" data-filter="prenotato" onclick="filterBookCopies(this)">
                <i class="fa-solid fa-clock" style="color: #D98F10;"></i> Prenotati
            </button>
            <button type="button" class="filter-chip" data-filter="in-prestito" onclick="filterBookCopies(this)">
                <i class="fa-solid fa-book-open-reader" style="color: var(--color-error);"></i> In Prestito a
            </button>
            <button type="button" class="filter-chip" data-filter="eliminato" onclick="filterBookCopies(this)">
                <i class="fa-solid fa-trash-can opacity-50"></i> Eliminati
            </button>
        </div>

        <div class="popup-table-wrap">
            <table class="w-100 border-collapse">
                <thead>
                    <tr class="text-center border-b opacity-60">
                        <th class="text-xs uppercase  fw-700">ID Libro</th>
                        <th class="text-xs uppercase  fw-700">Stato</th>
                        <th class="text-xs uppercase  fw-700">Utente</th>
                        <th class="text-xs uppercase  fw-700 text-right">Azioni</th>
                    </tr>
                </thead>
                <tbody id="viewBooksListContainer" th:fragment="bookCopiesList">
                    <tr th:each="book : ${popupBooks}" class="text-center border-b hover-bg-light transition">
                        <td class="p-4 font-mono fw-600 text-brand">
                            <a th:href="@{'/api/navigation/bookRecords/' + ${book.bookDto.bookId}}" class="hover-underline">#[[${book.bookDto.bookId}]]</a>
                        </td>
                        <td class="p-4">
                            <div class="status-pill" th:classappend="${#strings.replace(book.bookDto.status, ' ', '-')}">
                                <i th:if="${book.bookDto.status == 'disponibilita'}" class="fa-solid fa-circle-check"></i>
                                <i th:if="${book.bookDto.status == 'prenotato'}" class="fa-solid fa-clock"></i>
                                <i th:if="${book.bookDto.status == 'in prestito' && book.rentalExpired >= T(java.time.LocalDate).now()}" class="fa-solid fa-book-open-reader"></i>
                                <i th:if="${book.bookDto.status == 'scaduto'}" class="fa-solid fa-triangle-exclamation"></i>
                                <i th:if="${book.bookDto.status == 'eliminato'}" class="fa-solid fa-trash-can"></i>
                                <i class="fa-solid fa-triangle-exclamation" th:if="${book.rentalExpired < T(java.time.LocalDate).now()}"></i>
                                <span class="" th:if="${book.rentalExpired < T(java.time.LocalDate).now()}" th:text="${'Scaduto'}"></span>
                                <span th:if="${book.rentalExpired >= T(java.time.LocalDate).now()}" th:text="${book.bookDto.status}">STATO</span>
                            </div>
                        </td>
                        <td class="p-4">
                            <div th:if="${book.userDto.userName != null}" class="flex align-center justify-center gap-2">
                                <div class="avatar-xs bg-surface-2 radius-50 flex center font-size-xs fw-700 text-brand" 
                                     th:text="${(!#strings.isEmpty(book.userDto.userName) ? #strings.substring(book.userDto.userName,0,1) : '') + (!#strings.isEmpty(book.userDto.userLastName) ? #strings.substring(book.userDto.userLastName,0,1) : '')}">US</div>
                                <span class="text-sm fw-600 opacity-80" th:text="${book.userDto.userName + ' ' + book.userDto.userLastName}">Nome Cognome</span>
                            </div>
                            <span th:if="${book.userDto.userName == null}" class="opacity-30 text-xs">---</span>
                        </td>
                        <td class="p-4 text-right">
                            <button th:if="${book.bookDto.status == 'disponibilita'}" type="button" class="btn-modern-action" th:data-title="${popupEditionTitle}" th:data-url="'/api/deleteBook?bookId=' + ${book.bookDto.bookId}" onclick="triggerConfirmDelete(this)">
                                <i class="fa-solid fa-trash mr-1"></i> Elimina
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
