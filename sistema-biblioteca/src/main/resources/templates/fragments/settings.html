<div th:fragment="settings" class="settings-wrapper animate-fade-in">

    <!-- Page Header -->
    <div class="settings-page-header">
        <div class="settings-page-header-inner">
            <div class="settings-page-title-group">
                <div class="settings-page-icon">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h2 class="settings-page-title">Gestione Libreria</h2>
                    <p class="settings-page-subtitle">Gestisci Titoli, Autori, Editori e Categorie della tua biblioteca.</p>
                </div>
            </div>
            <!-- Stats bar -->
            <div class="settings-stats-bar">
                <div class="settings-stat-chip stat-titles">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span th:text="${bookNames.size()}">0</span>
                    <span class="stat-label">Titoli</span>
                </div>
                <div class="settings-stat-chip stat-authors">
                    <i class="fa-solid fa-user-pen"></i>
                    <span th:text="${authors.size()}">0</span>
                    <span class="stat-label">Autori</span>
                </div>
                <div class="settings-stat-chip stat-publishers">
                    <i class="fa-solid fa-building-columns"></i>
                    <span th:text="${publishers.size()}">0</span>
                    <span class="stat-label">Editori</span>
                </div>
                <div class="settings-stat-chip stat-categories">
                    <i class="fa-solid fa-tags"></i>
                    <span th:text="${categories.size()}">0</span>
                    <span class="stat-label">Categorie</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="settings-tab-bar">
        <button class="settings-tab active" data-target="tab-titles" onclick="switchSettingsTab(this, 'tab-titles')">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>Titoli manuali</span>
        </button>
        <button class="settings-tab" data-target="tab-authors" onclick="switchSettingsTab(this, 'tab-authors')">
            <i class="fa-solid fa-user-pen"></i>
            <span>Autori</span>
        </button>
        <button class="settings-tab" data-target="tab-publishers" onclick="switchSettingsTab(this, 'tab-publishers')">
            <i class="fa-solid fa-building-columns"></i>
            <span>Editori</span>
        </button>
        <button class="settings-tab" data-target="tab-categories" onclick="switchSettingsTab(this, 'tab-categories')">
            <i class="fa-solid fa-tags"></i>
            <span>Categorie</span>
        </button>
    </div>

    <!-- Tab Panels -->
    <div class="settings-panels">

        <!-- ─── TITOLI ─── -->
        <div id="tab-titles" class="settings-panel active card-titles">
            <div class="panel-toolbar">
                <div class="panel-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="panel-search-input" placeholder="Cerca titolo..."
                           onkeyup="filterSettingsList(this, 'titles-list')">
                </div>
                <button class="btn-panel-add" onclick="openAddTitlePopup()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuovo titolo</span>
                </button>
            </div>
            <div class="settings-list" id="titles-list">
                <div th:each="bn : ${bookNames}" class="settings-item"
                     th:data-search="${bn.title.toLowerCase()}">
                    <div class="settings-item-info">
                        <span class="settings-item-name" th:text="${bn.title}">Titolo</span>
                        <span class="settings-item-id" th:text="'ID: #' + ${bn.bookNameId}">ID</span>
                    </div>
                    <div class="settings-actions">
                        <button class="btn-icon-settings"
                                th:data-id="${bn.bookNameId}" th:data-title="${bn.title}"
                                onclick="openEditBookNamePopup(this.getAttribute('data-id'), this.getAttribute('data-title'))"
                                title="Modifica">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>
                <div th:if="${bookNames.isEmpty()}" class="settings-empty">
                    <i class="fa-solid fa-box-open"></i>
                    <p>Nessun titolo registrato.</p>
                </div>
            </div>
        </div>

        <!-- ─── AUTORI ─── -->
        <div id="tab-authors" class="settings-panel card-authors">
            <div class="panel-toolbar">
                <div class="panel-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="panel-search-input" placeholder="Cerca autore..."
                           onkeyup="filterSettingsList(this, 'authors-list')">
                </div>
                <button class="btn-panel-add" onclick="openAddAuthorPopup()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuovo autore</span>
                </button>
            </div>
            <div class="settings-list" id="authors-list">
                <div th:each="author : ${authors}" class="settings-item"
                     th:data-search="${(author.authorName + ' ' + author.authorLastName).toLowerCase()}">
                    <div class="settings-item-info">
                        <span class="settings-item-name"
                              th:text="${author.authorName + ' ' + author.authorLastName}">Autore</span>
                        <span class="settings-item-id" th:text="'ID: #' + ${author.authorId}">ID</span>
                    </div>
                    <div class="settings-actions">
                        <button class="btn-icon-settings"
                                th:data-id="${author.authorId}"
                                th:data-name="${author.authorName}"
                                th:data-lastname="${author.authorLastName}"
                                onclick="openEditAuthorFullPopup(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-lastname'))"
                                title="Modifica">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>
                <div th:if="${authors.isEmpty()}" class="settings-empty">
                    <i class="fa-solid fa-user-slash"></i>
                    <p>Nessun autore registrato.</p>
                </div>
            </div>
        </div>

        <!-- ─── EDITORI ─── -->
        <div id="tab-publishers" class="settings-panel card-publishers">
            <div class="panel-toolbar">
                <div class="panel-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="panel-search-input" placeholder="Cerca editore..."
                           onkeyup="filterSettingsList(this, 'publishers-list')">
                </div>
                <button class="btn-panel-add" onclick="openAddPublisherPopup()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuovo editore</span>
                </button>
            </div>
            <div class="settings-list" id="publishers-list">
                <div th:each="pub : ${publishers}" class="settings-item"
                     th:data-search="${pub.publisherName.toLowerCase()}">
                    <div class="settings-item-info">
                        <span class="settings-item-name" th:text="${pub.publisherName}">Editore</span>
                        <span class="settings-item-id" th:text="'ID: #' + ${pub.publisherId}">ID</span>
                    </div>
                    <div class="settings-actions">
                        <button class="btn-icon-settings"
                                th:data-id="${pub.publisherId}"
                                th:data-name="${pub.publisherName}"
                                onclick="openEditPublisherFullPopup(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                                title="Modifica">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>
                <div th:if="${publishers.isEmpty()}" class="settings-empty">
                    <i class="fa-solid fa-building-slash"></i>
                    <p>Nessun editore registrato.</p>
                </div>
            </div>
        </div>

        <!-- ─── CATEGORIE ─── -->
        <div id="tab-categories" class="settings-panel card-categories">
            <div class="panel-toolbar">
                <div class="panel-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="panel-search-input" placeholder="Cerca categoria..."
                           onkeyup="filterSettingsList(this, 'categories-list')">
                </div>
                <button class="btn-panel-add" onclick="openAddCategoryPopup()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuova categoria</span>
                </button>
            </div>
            <div class="settings-list" id="categories-list">
                <div th:each="cat : ${categories}" class="settings-item"
                     th:data-search="${cat.categoryName.toLowerCase()}">
                    <div class="settings-item-info">
                        <span class="settings-item-name" th:text="${cat.categoryName}">Categoria</span>
                        <span class="settings-item-id" th:text="'ID: #' + ${cat.categoryId}">ID</span>
                    </div>
                    <div class="settings-actions">
                        <button class="btn-icon-settings"
                                th:data-id="${cat.categoryId}"
                                th:data-name="${cat.categoryName}"
                                onclick="openEditCategoryFullPopup(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                                title="Modifica">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>
                <div th:if="${categories.isEmpty()}" class="settings-empty">
                    <i class="fa-solid fa-tags-slash"></i>
                    <p>Nessuna categoria registrata.</p>
                </div>
            </div>
        </div>

    </div>

</div>
