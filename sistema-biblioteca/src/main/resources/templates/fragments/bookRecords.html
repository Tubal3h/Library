<!-- 
    -------------------------------------------------------------------------
    BOOK RECORDS FRAGMENT (BOOKRECORDS.HTML)
    -------------------------------------------------------------------------
-->
<div class="dashboard-grid" th:fragment="bookRecords">
    <!-- Header della Sezione -->
    <header class="dashboard-header flex justify-between align-center mb-8 animate-fade-in-up">
        <div class="flex align-center gap-5">
            <a th:href="@{/api/navigation/edition}" class="btn-back-premium" title="Torna ai Manuali">
                <i class="fa-solid fa-chevron-left"></i>
                <span>Manuali</span>
            </a>
            <div class="header-content">
                <span class="header-subtitle uppercase tracking-widest text-xs opacity-50 mb-1 block">Archivio
                    Storico</span>
                <h2 class="text-4xl fw-800 text-gradient-brand leading-tight"
                    th:text="${targetRecordName ?: 'Registro Libro'}">Registro Libro</h2>
            </div>
        </div>

        <div class="header-stats flex gap-4 hide-mobile">
            <div class="stat-pill glass">
                <span class="stat-label">Totale Record</span>
                <span class="stat-value" th:text="${#lists.size(bookRecords)}">0</span>
            </div>
        </div>
    </header>

    <div class="records-view-container">
        <!-- Tabella Desktop -->
        <div class="premium-table-wrapper glass radius-24 shadow-xl overflow-hidden animate-fade-in-up delay-2">
            <div class="records-table">
                <div class="table-header">
                    <div class="header-col col-id">ID Libro</div>
                    <div class="header-col col-user">Utente</div>
                    <div class="header-col col-rent">ID Noleggio</div>
                    <div class="header-col col-dates">Periodo Prestito</div>
                    <div class="header-col col-status">Stato</div>
                </div>

                <div class="table-body">
                    <div th:each="record, iter : ${bookRecords}" class="table-row animate-row"
                        th:classappend="${record.rentalEnded == null ? 'row-active' : ''}"
                        th:style="'--row-index: ' + ${iter.index}">

                        <!-- ID Libro -->
                        <div class="table-cell col-id">
                            <span class="badge-mono" th:text="${record.bookDto.bookId}">000</span>
                        </div>
 
                        <!-- Utente -->
                        <div class="table-cell col-user">
                            <div class="user-info">
                                <div class="user-avatar"
                                    th:text="${(!#strings.isEmpty(record.userDto.userName) ? #strings.substring(record.userDto.userName,0,1) : '') + (!#strings.isEmpty(record.userDto.userLastName) ? #strings.substring(record.userDto.userLastName,0,1) : '')}">
                                    JD</div>
                                <div class="user-details">
                                    <a class="hover-underline" th:href="@{'/api/navigation/userRecords/' + ${record.userDto.userId}}">
                                        <span class="user-fullname"
                                            th:text="${record.userDto.userName + ' ' + record.userDto.userLastName}">John Doe
                                        </span>
                                    </a>
                                    <span class="user-role-label">Socio</span>
                                </div>
                            </div>
                        </div>

                        <!-- ID Noleggio -->
                        <div class="table-cell col-rent">
                            <span class="rent-id" th:text="'#' + ${record.rentalId}">#123</span>
                        </div>

                        <!-- Periodo -->
                        <div class="table-cell col-dates">
                            <div class="date-range">
                                <div class="date-item start">
                                    <i class="fa-solid fa-calendar-check"></i>
                                    <span
                                        th:text="${record.rentalDate != null ? #temporals.format(record.rentalDate, 'dd MMM yyyy') : #temporals.format(record.bookingDate, 'dd MMM yyyy')} ?: 'N/D'">-</span>
                                </div>
                                <div class="date-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>
                                <div class="date-item end"
                                    th:classappend="${record.rentalEnded != null ? 'ended' : ''}">
                                    <i
                                        th:class="${record.rentalEnded != null ? 'fa-solid fa-calendar-xmark' : 'fa-solid fa-clock'}"></i>
                                    <span
                                        th:text="${record.rentalEnded != null ? #temporals.format(record.rentalEnded, 'dd MMM yyyy') : (record.rentalExpired != null ? #temporals.format(record.rentalExpired, 'dd MMM yyyy') : '---')}">---</span>
                                </div>
                            </div>
                        </div>

                        <!-- Stato -->
                        <div class="table-cell col-status">
                            <!-- Stato Prenotato (Richiesta effettuata ma non ancora consegnato) -->
                            <div th:if="${record.rentalDate == null && record.rentalEnded == null}"
                                class="status-indicator pending">
                                <i class="fa-solid fa-clock"></i>
                                <span class="status-text">Prenotato</span>
                            </div>
                            <!-- Stato In Corso (In prestito) -->
                            <div th:if="${record.rentalDate != null && record.rentalEnded == null && (record.rentalExpired == null || record.rentalExpired >= T(java.time.LocalDate).now())}"
                                class="status-indicator active">
                                <span class="pulse-dot"></span>
                                <span class="status-text">In Prestito</span>
                            </div>
                            <!-- Stato Scaduto (In prestito ma non restituito entro la data di scadenza) -->
                            <div th:if="${record.rentalDate != null && record.rentalEnded == null && record.rentalExpired != null && record.rentalExpired < T(java.time.LocalDate).now()}"
                                class="status-indicator overdue">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <span class="status-text">Scaduto</span>
                            </div>
                            <!-- Stato Concluso (Restituito) -->
                            <div th:if="${record.rentalEnded != null}" class="status-indicator completed">
                                <i class="fa-solid fa-circle-check"></i>
                                <span class="status-text">Concluso</span>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State Integrato nella tabella -->
                    <div th:if="${#lists.isEmpty(bookRecords)}" class="table-empty-state">
                        <div class="empty-content p-16 text-center">
                            <div class="empty-illustration mb-6">
                                <i class="fa-solid fa-receipt text-6xl opacity-10"></i>
                            </div>
                            <h3 class="text-xl fw-700 opacity-60 mb-2">nessun prestito registrato</h3>
                            <p class="text-nm opacity-40">Non ci sono movimenti nello storico di questo libro.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
>
