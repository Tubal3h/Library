<!DOCTYPE html>
<html th:fragment="master(titolo, contenuto)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titolo} ?: 'Library | Sistema Biblioteca'"></title>

    <!-- Librerie esterne -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stili Base -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Stili Frammenti (Layout, Navbar, Footer) -->
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/catalog.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/popup.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/searchbar.css}">
    
    <!-- Stili View Specifiche -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo_mba.svg}">
</head>

<body data-theme="light">
    <!-- Background Glow Effect (similar to image) -->
    <div class="bg-glow"></div>

    <div class="app-container flex w-100 h-100vh overflow-hidden">
        <!-- Sidebar Navigation -->
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <!-- Main Content Area -->
        <main id="app-main" class="flex-1 overflow-y-auto p-relative animate-fade-in-up opacity-0 delay-1">
            <div th:replace="${contenuto}">
                Contenuto di fallback
            </div>
        </main>
    </div>

    <!-- Global Popup (outside scroll containers and stacking contexts) -->
    <div th:replace="~{fragments/popup :: popup}"></div>
    <div th:replace="~{fragments/searchbar :: searchbar}"></div>

    <!-- Script Globali e Frammenti -->
    <script th:src="@{/js/fragments/layout.js}"></script>
    <script th:src="@{/js/fragments/navbar.js}"></script>
    <script th:src="@{/js/fragments/catalog.js}"></script>
    <script th:src="@{/js/fragments/popup.js}"></script>
    <script th:src="@{/js/fragments/searchbar.js}"></script>

    <!--/* Script auto-popup da Flash Attributes (RedirectAttributes) */-->
    <th:block th:if="${popupType != null}">
        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function () {
                const popupType   = /*[[${popupType}]]*/ null;
                const bookIsbn    = /*[[${popupBookIsbn}]]*/ null;
                const bookId      = /*[[${popupBookId}]]*/ null;
                const bookTitle   = /*[[${popupBookTitle}]]*/ null;
                const errorMsg    = /*[[${popupErrorMessage}]]*/ null;
                const userName    = /*[[${popupUserName}]]*/ null;
                const userEmail   = /*[[${popupUserEmail}]]*/ null;
                const userRole    = /*[[${popupUserRole}]]*/ null;

                // Nascondi tutti i pannelli del body
                document.getElementById('editBookContent').classList.add('none');
                document.getElementById('addCopyContent').classList.add('none');
                document.getElementById('addEditionSuccessContent')?.classList.add('none');
                document.getElementById('deleteBookContent').classList.add('none');
                document.getElementById('errorContent').classList.add('none');
                document.getElementById('addUserSuccesContent')?.classList.add('none');

                // Nascondi il footer con "Annulla / Conferma" (non serve per i popup di feedback)
                const footer = document.querySelector('.popup-footer');
                if (footer) footer.classList.add('none');

                if (popupType === 'addCopy') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-check text-white font-size-medium';
                    document.getElementById('popupTitle').textContent = 'Copia aggiunta';
                    document.getElementById('addCopyBookTitle').textContent = bookTitle || '';
                    document.getElementById('addCopyBookId').textContent = bookId || '';
                    document.getElementById('addCopyBookName').textContent = bookIsbn || '';
                    document.getElementById('addCopyContent').classList.remove('none');

                } else if (popupType === 'addEdition') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-check text-white font-size-medium';
                    document.getElementById('popupTitle').textContent = 'Edizione aggiunta';
                    document.getElementById('addEditionSuccessBookTitle').textContent = bookTitle || '';
                    document.getElementById('addEditionSuccessBookIsbn').textContent = bookIsbn || '';
                    document.getElementById('addEditionSuccessContent').classList.remove('none');

                } else if (popupType === 'deleteBook') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-trash-can text-white font-size-medium';
                    document.getElementById('popupTitle').textContent = 'Copia eliminata';
                    document.getElementById('deleteBookTitle').textContent = bookTitle || '';
                    document.getElementById('deleteBookId').textContent = bookId || '';
                    document.getElementById('deleteBookContent').classList.remove('none');

                } else if (popupType === 'error') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-exclamation text-white font-size-medium';
                    document.getElementById('popupTitle').textContent = 'Errore';
                    document.getElementById('errorMessage').textContent = errorMsg || 'Operazione non riuscita.';
                    document.getElementById('errorContent').classList.remove('none');

                } else if (popupType === 'addUser') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-user-check text-white font-size-medium';
                    document.getElementById('popupTitle').textContent = 'Dipendente creato';
                    document.getElementById('addUserSuccessName').textContent = userName || '';
                    document.getElementById('addUserSuccessEmail').textContent = userEmail || '';
                    document.getElementById('addUserSuccessRole').textContent = userRole || '';
                    document.getElementById('addUserSuccessContent').classList.remove('none');

                // Mostra l'overlay del popup
                document.getElementById('genericPopup').classList.remove('none');
                }
            });
        </script>
    </th:block>
</body>

</html>
