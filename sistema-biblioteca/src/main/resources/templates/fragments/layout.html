<!DOCTYPE html>
<html th:fragment="master(titolo, contenuto)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titolo} ?: 'Library | Sistema Biblioteca'"></title>

    <!-- Librerie esterne -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stili Base -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Stili Frammenti (Layout, Navbar, Footer) -->
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/catalog.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/settings.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/popup.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/searchbar.css}">
    
    <!-- Stili View Specifiche -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo_mba.svg}">
</head>

<body data-theme="light">
    <!-- Background Glow Effect (similar to image) -->
    <div class="bg-glow"></div>

    <div class="app-container flex w-100 h-100vh overflow-hidden">
        <!-- Sidebar Navigation -->
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <!-- Main Content Area -->
        <main id="app-main" class="flex-1 overflow-y-auto p-relative animate-fade-in-up opacity-0 delay-1">
            <div th:replace="${contenuto}">
                Contenuto di fallback
            </div>
        </main>
    </div>

    <!-- Global Popup (outside scroll containers and stacking contexts) -->
    <div th:replace="~{fragments/popup :: popup}"></div>
    <div th:replace="~{fragments/searchbar :: searchbar}"></div>

    <!-- Script Globali e Frammenti -->
    <script th:src="@{/js/fragments/layout.js}"></script>
    <script th:src="@{/js/fragments/navbar.js}"></script>
    <script th:src="@{/js/fragments/catalog.js}"></script>
    <script th:src="@{/js/fragments/popup.js}"></script>
    <script th:src="@{/js/fragments/settings.js}"></script>
    <script th:src="@{/js/fragments/searchbar.js}"></script>

    <!--/* Script auto-popup da Flash Attributes (RedirectAttributes) */-->
    <th:block th:if="${popupType != null}">
        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function () {
                const popupType   = /*[[${popupType}]]*/ null;
                const bookIsbn    = /*[[${popupBookIsbn}]]*/ null;
                const bookId      = /*[[${popupBookId}]]*/ null;
                const bookTitle   = /*[[${popupBookTitle}]]*/ null;
                const errorMsg    = /*[[${popupErrorMessage}]]*/ null;
                const userName    = /*[[${popupUserName}]]*/ null;
                const userEmail   = /*[[${popupUserEmail}]]*/ null;
                const userRole    = /*[[${popupUserRole}]]*/ null;
                const popupUserId = /*[[${popupUserId}]]*/ null;
                
                const authorId      = /*[[${popupAuthorId}]]*/ null;
                const authorName    = /*[[${popupAuthorName}]]*/ null;
                const authorLastName= /*[[${popupAuthorLastName}]]*/ null;
                
                const publisherId   = /*[[${popupPublisherId}]]*/ null;
                const publisherName = /*[[${popupPublisherName}]]*/ null;
                
                const categoryId    = /*[[${popupCategoryId}]]*/ null;
                const categoryName  = /*[[${popupCategoryName}]]*/ null;

                // Nascondi tutti i pannelli del body
                document.getElementById('editBookContent').classList.add('none');
                document.getElementById('addCopyContent').classList.add('none');
                document.getElementById('addEditionSuccessContent')?.classList.add('none');
                document.getElementById('deleteBookContent').classList.add('none');
                document.getElementById('deleteUserContent')?.classList.add('none');
                document.getElementById('errorContent').classList.add('none');
                document.getElementById('addUserSuccessContent')?.classList.add('none');
                document.getElementById('deliveredRentContent')?.classList.add('none');
                document.getElementById('bookedRentContent')?.classList.add('none');
                document.getElementById('updateTitleContent')?.classList.add('none');
                document.getElementById('updateAuthorContent')?.classList.add('none');
                document.getElementById('updatePublisherContent')?.classList.add('none');
                document.getElementById('updateCategoryContent')?.classList.add('none');
                document.getElementById('changePasswordContent')?.classList.add('none');

                // Nascondi il footer con "Annulla / Conferma" (non serve per i popup di feedback)
                const footer = document.querySelector('.popup-footer');
                if (footer) footer.classList.add('none');

                // Helper per assegnare in sicurezza il testo (gestisce anche oggetti/DTO)
                const setTextIfExists = (id, val) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    
                    if (val && typeof val === 'object') {
                        // Se è un oggetto, prova a estrarre un campo testuale comune
                        el.textContent = val.title || val.name || val.authorName || val.publisherName || val.categoryName || JSON.stringify(val);
                    } else {
                        el.textContent = val || '';
                    }
                };

                // Debug logging per i parametri del popup
                console.log("[Popup Debug]", { popupType, bookId, bookTitle, authorName, publisherName, categoryName });

                if (popupType === 'addCopy') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-check text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Copia aggiunta');
                    setTextIfExists('addCopyBookTitle', bookTitle);
                    setTextIfExists('addCopyBookId', bookId);
                    setTextIfExists('addCopyBookName', bookIsbn);
                    document.getElementById('addCopyContent').classList.remove('none');

                } else if (popupType === 'addEdition') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-check text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Edizione aggiunta');
                    setTextIfExists('addEditionSuccessBookTitle', bookTitle);
                    setTextIfExists('addEditionSuccessBookIsbn', bookIsbn);
                    document.getElementById('addEditionSuccessContent').classList.remove('none');

                } else if (popupType === 'deleteBook') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-trash-can text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Copia eliminata');
                    setTextIfExists('deleteBookTitle', bookTitle);
                    setTextIfExists('deleteBookId', bookId);
                    document.getElementById('deleteBookContent').classList.remove('none');

                } else if (popupType === 'deleteUser') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-trash-can text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Dipendente eliminato');
                    setTextIfExists('deleteUserTitle', userName);
                    setTextIfExists('deleteUserId', popupUserId);
                    document.getElementById('deleteUserContent').classList.remove('none');

                } else if (popupType === 'error') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-exclamation text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Errore');
                    setTextIfExists('errorMessage', errorMsg || 'Operazione non riuscita.');
                    document.getElementById('errorContent').classList.remove('none');

                } else if (popupType === 'addUser') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-user-check text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Dipendente creato');
                    setTextIfExists('addUserSuccessName', userName);
                    setTextIfExists('addUserSuccessEmail', userEmail);
                    setTextIfExists('addUserSuccessRole', userRole);
                    document.getElementById('addUserSuccessContent').classList.remove('none');

                } else if (popupType === 'delivered') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-box-open text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Consegnata');
                    setTextIfExists('deliveredBookTitle', bookTitle);
                    setTextIfExists('deliveredBookId', bookId);
                    document.getElementById('deliveredRentContent').classList.remove('none');
                    
                } else if (popupType === 'returned') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-circle-check text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Restituita');
                    setTextIfExists('returnedBookTitle', bookTitle);
                    setTextIfExists('returnedBookId', bookId);
                    document.getElementById('returnedRentContent').classList.remove('none');
                    
                } else if (popupType === 'booked') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-bookmark text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Prenotata');
                    setTextIfExists('bookedBookId', bookId);
                    document.getElementById('bookedRentContent').classList.remove('none');
                    
                } else if (popupType === 'updateTitle') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-pen-to-square text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Titolo aggiornato');
                    setTextIfExists('updateTitleBookId', bookId);
                    setTextIfExists('updateTitleBookName', bookTitle);
                    document.getElementById('updateTitleContent').classList.remove('none');
                } else if (popupType === 'updateAuthor') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-user-pen text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Autore aggiornato');
                    setTextIfExists('updateAuthorId', authorId);
                    setTextIfExists('updateAuthorName', authorName);
                    setTextIfExists('updateAuthorLastName', authorLastName);
                    document.getElementById('updateAuthorContent').classList.remove('none');
                } else if (popupType === 'updatePublisher') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-building-columns text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Editore aggiornato');
                    setTextIfExists('updatePublisherId', publisherId);
                    setTextIfExists('updatePublisherName', publisherName);
                    document.getElementById('updatePublisherContent').classList.remove('none');
                } else if (popupType === 'updateCategory') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-tag text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Categoria aggiornata');
                    setTextIfExists('updateCategoryId', categoryId);
                    setTextIfExists('updateCategoryName', categoryName);
                    document.getElementById('updateCategoryContent').classList.remove('none');
                } else if (popupType === 'changePassword') {
                    document.getElementById('popupIcon').className = 'fa-solid fa-lock text-white font-size-medium';
                    setTextIfExists('popupTitle', 'Password aggiornata');
                    document.getElementById('changePasswordContent').classList.remove('none');
                }

                // Mostra l'overlay del popup
                document.getElementById('genericPopup').classList.remove('none');
            });

        </script>
    </th:block>
</body>

</html>
