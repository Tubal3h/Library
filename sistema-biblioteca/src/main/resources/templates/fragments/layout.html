<!DOCTYPE html>
<html th:fragment="master(titolo, contenuto)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titolo} ?: 'Library | Sistema Biblioteca'"></title>

    <!-- Librerie esterne -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stili Base -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Stili Frammenti (Layout, Navbar, Footer) -->
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/catalog.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/settings.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/popup.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/searchbar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/bookRecords.css}">
    
    <!-- Stili View Specifiche -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo_mba.svg}">
</head>

<body data-theme="light">
    <!-- Background Glow Effect (similar to image) -->
    <div class="bg-glow"></div>

    <div class="app-container flex w-100 h-100vh overflow-hidden">
        <!-- Sidebar Navigation -->
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <!-- Main Content Area -->
        <main id="app-main" class="flex-1 overflow-y-auto p-relative animate-fade-in-up opacity-0 delay-1">
            <div th:replace="${contenuto}">
                Contenuto di fallback
            </div>
        </main>
    </div>

    <!-- Global Popup (outside scroll containers and stacking contexts) -->
    <div th:replace="~{fragments/popup :: popup}"></div>
    <div th:replace="~{fragments/searchbar :: searchbar}"></div>

    <!-- Script Globali e Frammenti -->
    <script th:src="@{/js/fragments/layout.js}"></script>
    <script th:src="@{/js/fragments/navbar.js}"></script>
    <script th:src="@{/js/fragments/catalog.js}"></script>
    <script th:src="@{/js/fragments/searchbar.js}"></script>
    
    <!-- New Modular Popup Scripts -->
    <script th:src="@{/js/fragments/popup.js}"></script>
    <script th:src="@{/js/fragments/popupFragments/editFieldOnlyContent.js}"></script>
    <script th:src="@{/js/fragments/popupFragments/successHandlers.js}"></script>
    <script th:src="@{/js/fragments/popupFragments/addHandlers.js}"></script>
    <script th:src="@{/js/fragments/popupFragments/updateHandlers.js}"></script>
    <script th:src="@{/js/fragments/popupFragments/utilityHandlers.js}"></script>

    <script th:src="@{/js/fragments/settings.js}"></script>


    <!--/* Script auto-popup da Flash Attributes (RedirectAttributes) - Refactored */-->
    <script th:if="${popupType != null}" th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof initSuccessPopup === 'function') {
                initSuccessPopup(/*[[${popupType}]]*/ null, {
                    title: /*[[${popupBookTitle != null ? popupBookTitle : (popupTitle != null ? popupTitle : popupBookName)}]]*/ null,
                    isbn: /*[[${popupBookIsbn}]]*/ null,
                    id: /*[[${popupBookId}]]*/ null,
                    authorName: /*[[${popupAuthorName}]]*/ null,
                    authorLastName: /*[[${popupAuthorLastName}]]*/ null,
                    publisherName: /*[[${popupPublisherName}]]*/ null,
                    categoryName: /*[[${popupCategoryName}]]*/ null,
                    errorMessage: /*[[${errorMessage != null ? errorMessage : popupErrorMessage}]]*/ null
                });
            }
        });
    </script>
</body>

</html>
