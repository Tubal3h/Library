<!-- 
    -------------------------------------------------------------------------
    USER RECORDS FRAGMENT (USERRECORDS.HTML)
    -------------------------------------------------------------------------
-->
<div class="dashboard-grid flex-column w-100" th:fragment="userRecords">
    <!-- Header della Sezione -->
    <header class="dashboard-header flex justify-between align-center gap-5 mb-8 animate-fade-in-up">
        <div class="flex align-center gap-5">
            <a th:href="@{/api/navigation/users}" class="btn-back-premium center" title="Torna agli Utenti">
                <i class="fa-solid fa-chevron-left"></i>
                <span>Sezione <br>dipendenti</span>
            </a>
            <div class="header-content">
                <span class="header-subtitle text-lg opacity-50 mb-1 block">Storico prestiti</span>
                <h2 class="text-2xl fw-800 text-brand leading-tight" th:text="${targetRecordName ?: 'Registro Utente'}">Registro Utente</h2>
            </div>
        </div>

        <div class="header-stats flex gap-4 hide-mobile">
            <div class="stat-pill glass">
                <span class="stat-label">Prestiti Totali</span>
                <span class="stat-value" th:text="${#lists.size(bookRecords)}">0</span>
            </div>
        </div>
    </header>

    <div class="records-view-container w-100">
        <!-- Tabella Desktop -->
        <div class="premium-table-wrapper glass radius-12 shadow-xl overflow-hidden animate-fade-in-up delay-2">
            <div class="records-table">
                <div class="table-header center">
                    <div class="header-col col-id">ID Libro</div>
                    <div class="header-col col-book">Titolo Libro</div>
                    <div class="header-col col-rent">ID Noleggio</div>
                    <div class="header-col col-dates">Periodo Prestito</div>
                    <div class="header-col col-status">Stato</div>
                </div>

                <div class="table-body">
                    <div th:each="record, iter : ${bookRecords}" 
                         class="table-row animate-row"
                         th:classappend="${record.rentalEnded == null ? 'row-active' : ''}"
                         th:style="'--row-index: ' + ${iter.index}">
                        
                        <!-- ID Libro -->
                        <div class=" col-id center">
                            <span class="badge-mono" th:text="${record.bookDto.bookId}">000</span>
                        </div>

                        <!-- Titolo Libro -->
                        <div  class=" col-book center">
                            <a th:href="@{/dashboard(section='edition',editionId=${record.bookDto.editionDto.editionId}, action='viewCopies', includeDeleted=true)}">
                                <span class="fw-700" th:text="${record.bookDto.editionDto.bookNameDto.title}">Il Signore degli Anelli</span>
                            </a>
                        </div>

                        <!-- ID Noleggio -->
                        <div class=" col-rent center">
                            <span class="rent-id" th:text="'#' + ${record.rentalId}">#123</span>
                        </div>

                        <!-- Periodo -->
                        <div class=" col-dates flex center">
                            <div class="date-range">
                                <div class="date-item start">
                                    <i class="fa-solid fa-calendar-check"></i>
                                    <span th:text="${record.rentalDate != null ? #temporals.format(record.rentalDate, 'dd MMM yyyy') : #temporals.format(record.bookingDate, 'dd MMM yyyy')} ?: 'N/D'">-</span>
                                </div>
                                <div class="date-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>
                                <div class="date-item end" th:classappend="${record.rentalEnded != null ? 'ended' : ''}">
                                    <i th:class="${record.rentalEnded != null ? 'fa-solid fa-calendar-xmark' : 'fa-solid fa-clock'}"></i>
                                    <span th:text="${record.rentalEnded != null ? #temporals.format(record.rentalEnded, 'dd MMM yyyy') : (record.rentalExpired != null ? #temporals.format(record.rentalExpired, 'dd MMM yyyy') : '---')}">---</span>
                                </div>
                            </div>
                        </div>

                        <!-- Stato -->
                        <div class=" col-status center">
                            <!-- Stato Prenotato (Richiesta effettuata ma non ancora consegnato) -->
                            <div th:if="${record.rentalDate == null && record.rentalEnded == null}" class="status-indicator pending center">
                                <i class="fa-solid fa-clock"></i>
                                <span class="status-text">Prenotato</span>
                            </div>
                            <!-- Stato In Corso (In prestito) -->
                            <div th:if="${record.rentalDate != null && record.rentalEnded == null && (record.rentalExpired == null || record.rentalExpired >= T(java.time.LocalDate).now())}" class="status-indicator active center">
                                <span class="pulse-dot"></span>
                                <span class="status-text">In Corso</span>
                            </div>
                            <!-- Stato Scaduto (In prestito ma non restituito entro la data di scadenza) -->
                            <div th:if="${record.rentalDate != null && record.rentalEnded == null && record.rentalExpired != null && record.rentalExpired < T(java.time.LocalDate).now()}" class="status-indicator expired center">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <span class="status-text">Scaduto</span>
                            </div>
                            <!-- Stato Concluso (Restituito) -->
                            <div th:if="${record.rentalEnded != null}" class="status-indicator completed center">
                                <i class="fa-solid fa-circle-check"></i>
                                <span class="status-text">Concluso</span>
                            </div>
                        </div>
                    </div>
                    <!-- Empty State Integrato nella tabella -->
                    <div th:if="${#lists.isEmpty(bookRecords)}" class="table-empty-state flex center w-100">
                        <div class="empty-content p-12 text-center">
                            <div class="empty-illustration mb-6">
                                <i class="fa-solid fa-receipt text-6xl opacity-10"></i>
                            </div>
                            <h3 class="text-xl fw-700 opacity-60 mb-2">Nessun prestito registrato</h3>
                            <p class="text-nm opacity-40">L'utente non ha ancora richiesto manuali.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
