<!-- 
    -------------------------------------------------------------------------
    USER RECORDS FRAGMENT (USERRECORDS.HTML)
    -------------------------------------------------------------------------
-->
<div class="dashboard-grid" th:fragment="userRecords">
    <!-- Header della Sezione -->
    <header class="dashboard-header flex justify-between align-center mb-8 animate-fade-in-up">
        <div class="flex align-center gap-5">
            <a th:href="@{/api/navigation/users}" class="btn-back-premium" title="Torna agli Utenti">
                <i class="fa-solid fa-chevron-left"></i>
                <span>Utenti</span>
            </a>
            <div class="header-content">
                <span class="header-subtitle uppercase tracking-widest text-xs opacity-50 mb-1 block">Profilo Utente</span>
                <h2 class="text-4xl fw-800 text-gradient-brand leading-tight" th:text="${targetRecordName ?: 'Registro Utente'}">Registro Utente</h2>
            </div>
        </div>

        <div class="header-stats flex gap-4 hide-mobile">
            <div class="stat-pill glass">
                <span class="stat-label">Prestiti Totali</span>
                <span class="stat-value" th:text="${#lists.size(bookRecords)}">0</span>
            </div>
        </div>
    </header>

    <div class="records-view-container">
        <!-- Tabella Desktop -->
        <div class="premium-table-wrapper glass radius-24 shadow-xl overflow-hidden animate-fade-in delay-2">
            <div class="records-table">
                <div class="table-header">
                    <div class="header-col col-id">ID Libro</div>
                    <div class="header-col col-book">Titolo Libro</div>
                    <div class="header-col col-rent">ID Noleggio</div>
                    <div class="header-col col-dates">Periodo Prestito</div>
                    <div class="header-col col-status">Stato</div>
                </div>

                <div class="table-body">
                    <div th:each="record, iter : ${bookRecords}" 
                         class="table-row animate-row"
                         th:classappend="${record.rentalEnded == null ? 'row-active' : ''}"
                         th:style="'--row-index: ' + ${iter.index}">
                        
                        <!-- ID Libro -->
                        <div class="table-cell col-id">
                            <span class="badge-mono" th:text="${record.bookId}">000</span>
                        </div>

                        <!-- Titolo Libro -->
                        <div class="table-cell col-book">
                            <div class="book-info">
                                <span class="book-title-cell fw-700" th:text="${record.bookTitle}">Il Signore degli Anelli</span>
                            </div>
                        </div>

                        <!-- ID Noleggio -->
                        <div class="table-cell col-rent">
                            <span class="rent-id" th:text="'#' + ${record.rentalId}">#123</span>
                        </div>

                        <!-- Periodo -->
                        <div class="table-cell col-dates">
                            <div class="date-range">
                                <div class="date-item start">
                                    <i class="fa-solid fa-calendar-check"></i>
                                    <span th:text="${#temporals.format(record.rentalDate, 'dd MMM yyyy')} ?: 'N/D'">-</span>
                                </div>
                                <div class="date-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>
                                <div class="date-item end" th:classappend="${record.rentalEnded != null ? 'ended' : ''}">
                                    <i th:class="${record.rentalEnded != null ? 'fa-solid fa-calendar-xmark' : 'fa-solid fa-clock'}"></i>
                                    <span th:text="${record.rentalEnded != null ? #temporals.format(record.rentalEnded, 'dd MMM yyyy') : #temporals.format(record.rentalExpired, 'dd MMM yyyy')} ?: 'N/D'">-</span>
                                </div>
                            </div>
                        </div>

                        <!-- Stato -->
                        <div class="table-cell col-status">
                            <div th:if="${record.rentalEnded == null}" class="status-indicator active">
                                <span class="pulse-dot"></span>
                                <span class="status-text">In Corso</span>
                            </div>
                            <div th:if="${record.rentalEnded != null}" class="status-indicator completed">
                                <i class="fa-solid fa-circle-check"></i>
                                <span class="status-text">Concluso</span>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State Integrato nella tabella -->
                    <div th:if="${#lists.isEmpty(bookRecords)}" class="table-empty-state">
                        <div class="empty-content p-16 text-center">
                            <div class="empty-illustration mb-6">
                                <i class="fa-solid fa-receipt text-6xl opacity-10"></i>
                            </div>
                            <h3 class="text-xl fw-700 opacity-60 mb-2">nessun prestito registrato</h3>
                            <p class="text-nm opacity-40">L'utente non ha ancora effettuato prestiti.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
